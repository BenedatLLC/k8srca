# k8srca — single declarative config. Applied with `k8srca sync`.
# See designs/001-architecture.md §6.

mcp:
  - name: k8stools
    url: http://k8stools:8000/mcp      # as the sandbox sees it, on k8srca-net
    sync_url: http://127.0.0.1:8000/mcp # as the host sees it (published port)
    wrap: worker_custom_tools
    prefix: k8s_                      # namespaces the worker's flat registry
    timeout_s: 60
    groups:
      # Cheap, low-volume, high-signal lookups the coordinator keeps for itself
      # so it need not delegate trivia (001 §3.3).
      triage:
        - get_namespaces
        - get_pod_summaries
        - get_pod_container_statuses
        - get_pod_events
        - get_deployment_summaries
        - get_node_summaries
        - get_events
        # "What changed?", answered live (k8stools 2.4.0): asked early and
        # cheap, so the coordinator should not have to delegate it (#1).
        - get_workload_history
      full: "*"

agents:
  rca-coordinator:
    role: coordinator
    description: >-
      Plans and concludes Kubernetes root-cause investigations. Holds the RCA
      knowledge base and the cluster architecture docs, keeps triage lookups
      for itself, and delegates high-volume reads. A copy can be spawned to own
      one independent sub-investigation.
    model:
      id: claude-sonnet-5
      effort: high
    system_prompt: agents/rca-coordinator.system.md
    skills:
      - skills/k8s-rca
      - skills/cluster-architecture
    builtin_tools: [read, grep, glob, bash]
    mcp_tools:
      k8stools: triage
    roster: [k8s-investigator, self]

  k8s-investigator:
    role: specialist
    description: >-
      Read-only Kubernetes specialist. Give it one scoped question about
      cluster state -- pods, events, logs, nodes, workloads -- plus the
      namespace and the patterns to look for. It greps rather than reads whole
      logs, and reports findings with the tool call that produced each one. Use
      it for anything log-shaped or spanning many objects.
    model:
      id: claude-haiku-4-5            # -> claude-sonnet-5 if the 200K window binds
    system_prompt: agents/k8s-investigator.system.md
    builtin_tools: [read, grep, glob, bash]
    mcp_tools:
      k8stools: full

# How the k8stools CONTAINER reaches the API server (docs/cluster-setup.md).
# `auto` inspects the kubeconfig: a loopback server is unreachable from a
# container, so a tunnel is set up; anything routable is used as-is.
# Only the ssh block is site-specific -- gateway, subnet, TLS name and uid are
# all derived at run time, so this file is portable.
cluster_access:
  mode: auto
  kubeconfig: ~/.kube/k8srca-reader.yaml
  container_kubeconfig: ~/.kube/k8srca-reader-container.yaml
  # Tunnel details are NOT here. A bastion address and an internal API-server
  # address are infrastructure topology, and committing them would make this
  # file non-portable in exactly the way the rest of it is portable.
  # Set K8SRCA_SSH_HOST and K8SRCA_SSH_REMOTE in .env instead.

# Sources for the cluster-architecture skill: dkgg's deployment wiki
# (packages/dkgg/docs/design.md). `model` writes its prose and classifies its
# components and connections; synthesis is cached by its inputs, so a rebuild
# of an unchanged deployment makes no call. `max_usd` refuses a synthesis
# estimated above it.
architecture:
  model: claude-opus-5
  max_usd: 2.0
  sources:
    # How the system works today. Needs no permissions beyond the read-only
    # ClusterRole already in use, and cannot go stale.
    - type: live_cluster
      server: k8stools
      namespaces: [default]

    # What actually changed in THIS cluster, from ReplicaSet revisions.
    # Upstream chart history answers a different question: what the project
    # changed, not what was applied here.
    - type: change_history
      namespaces: [default]

    # What the system is declared to be: the official chart, at the version
    # this cluster was installed from, rendered offline by `helm template`
    # (arch/fetch.py). 0.40.7 is the newest release whose sub-charts match the
    # deployed ones (grafana 10.5.8, opensearch 3.4.0, prometheus 28.2.0) at
    # the 2026-04-19 install; 0.40.1-0.40.6 match too. The release name is the
    # deployed one (app.kubernetes.io/instance). Chart default values: the
    # values used at install time are not recorded anywhere we can read.
    - type: chart_repo
      helm:
        repo: https://open-telemetry.github.io/opentelemetry-helm-charts
        chart: opentelemetry-demo
        version: 0.40.7
        release: my-otel-demo

    # What each part is for: the official demo documentation, from the
    # website's source at the last commit to the demo docs before the install
    # (2026-04-13). Pinned by commit so the skill cannot change because a web
    # page did. A page named for a service attaches to it; the rest is kept as
    # system-level documentation (the wiki's index).
    - type: docs
      git:
        repo: https://github.com/open-telemetry/opentelemetry.io
        ref: d503571bbd711e05b9e6f85966fed6f0e00ba910
        path: content/en/docs/demo/services

environment:
  type: self_hosted

sandbox:
  # Repository only. The tag is the commit the image was built from, so a
  # rebuild cannot move under a running session.  `k8srca sandbox build`
  image: k8srca/sandbox
  network: k8srca-net
  memory: 2g
  cpus: "2"
  workspaces: .k8srca/workspaces

session:
  budget_usd: 5.00
  idle_ttl_minutes: 120
