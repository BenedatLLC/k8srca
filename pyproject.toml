[project]
name = "k8srca"
version = "0.1.0"
description = "Kubernetes root cause analysis built on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "k8stools>=1.1.0",
    "mcp>=2.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "slack-bolt>=1.21",
]

[project.scripts]
k8srca = "k8srca.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8srca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
