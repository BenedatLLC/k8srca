[project]
name = "k8srca"
version = "0.1.0"
description = "Kubernetes root cause analysis built on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jeff Fischer" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "k8stools>=4.5.0",
    # The standalone architecture-skill generator, a workspace member
    # (packages/kubewiki). It must never import k8srca; a test checks.
    "kubewiki",
    "mcp>=2.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "slack-bolt>=1.21",
]

[project.scripts]
k8srca = "k8srca.cli:app"

[project.optional-dependencies]
# promtools (packages/promtools, design 009) is a workspace member k8srca does
# not import: the agent reaches it over MCP, as its own container, as it reaches
# k8stools. So it is here for its tests, and stays out of the sandbox image.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "promtools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/kubewiki", "packages/promtools"]

[tool.uv.sources]
kubewiki = { workspace = true }
promtools = { workspace = true }

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under src/k8srca, templates included.
# A force-include for the same path makes hatchling add each file twice and the
# wheel build fails -- which an editable dev install never exercises.
packages = ["src/k8srca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/kubewiki/tests", "packages/promtools/tests"]
# `live` costs money and needs a cluster, a synced control plane and a running
# poller; it is opt-in via K8SRCA_TEST_LIVE=1, which the module also checks.
markers = ["live: end-to-end against the real stack (not hermetic, not free)"]
