[project]
name = "k8srca"
version = "0.1.0"
description = "Kubernetes root cause analysis built on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jeff Fischer" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "k8stools>=1.2.0",
    "mcp>=2.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "slack-bolt>=1.21",
]

[project.scripts]
k8srca = "k8srca.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under src/k8srca, templates included.
# A force-include for the same path makes hatchling add each file twice and the
# wheel build fails -- which an editable dev install never exercises.
packages = ["src/k8srca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` costs money and needs a cluster, a synced control plane and a running
# poller; it is opt-in via K8SRCA_TEST_LIVE=1, which the module also checks.
markers = ["live: end-to-end against the real stack (not hermetic, not free)"]
