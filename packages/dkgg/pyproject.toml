[project]
name = "dkgg"
version = "0.1.0"
description = "Deployment knowledge graph generator: a wiki of a Kubernetes deployment for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Same floors as k8srca, which depends on dkgg: they must not drift apart.
    "mcp>=2.2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships the query-tool template under src/dkgg/templates with the package.
packages = ["src/dkgg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
