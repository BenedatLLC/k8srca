[project]
name = "promtools"
version = "0.1.0"
description = "Read-only Prometheus tools for LLM agents: an MCP server whose results carry their Kubernetes caveats, and a capture for replay"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Same floor as k8srca, which runs this server beside k8stools: they must
    # not drift apart. HTTP is the standard library's, so the one place that
    # talks to Prometheus is small enough to read (client.py).
    "mcp>=2.2.0",
]

[project.scripts]
promtools = "promtools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promtools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
