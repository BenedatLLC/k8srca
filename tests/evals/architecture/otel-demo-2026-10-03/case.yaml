name: otel-demo-2026-10-03
description: >-
  Our OpenTelemetry demo install, captured 2026-10-03 with k8stools 2.3.0, so
  it lists DaemonSets and every pod names its owner: the case that checks pods
  are grouped into workloads by owner rather than by name. Every source the
  production build uses: the live
  cluster, its change history, the official chart and the official docs,
  both pinned to the install (2026-04-19).
capture: k8s.json
namespaces: [default]
sources:
  - type: live_cluster
  - type: change_history
  - type: chart_repo
    helm:
      repo: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-demo
      version: 0.40.7
      release: my-otel-demo
  - type: docs
    git:
      repo: https://github.com/open-telemetry/opentelemetry.io
      ref: d503571bbd711e05b9e6f85966fed6f0e00ba910
      path: content/en/docs/demo/services
# The demo's own service diagram, at the docs commit above: checks the
# hand-reviewed dependency truth, not the generator (truth.yaml lists the
# differences someone has explained).
reference:
  git:
    repo: https://github.com/open-telemetry/opentelemetry.io
    ref: d503571bbd711e05b9e6f85966fed6f0e00ba910
    path: content/en/docs/demo/architecture.md
  aliases: {queue: kafka, cache: valkey-cart, flagd-ui: flagd}
  reverse_from: [queue]
# Service dependencies from this install's Jaeger (/api/dependencies, 24 hours
# to 2026-10-04 15:24, after a load-test run and a browser session): a check on
# the dependency truth from real traffic, never a generator input.
# `frontend-web` is the browser side of the frontend, outside the cluster: not
# a component, so its calls are not compared. Brokers show as producer -> consumer; datastores, caches and
# telemetry backends do not show at all, and flag reads only sometimes (most
# are served from the flagd provider's local cache), so edges to these are not
# expected in the traces.
traces:
  file: jaeger-dependencies.json
  queues: [kafka]
  untraced: [postgresql, valkey-cart, flagd, otel-collector, opensearch, prometheus]
