# Reviewed truth for the cluster-architecture eval: our OTel demo install, captured
# 2026-10-03 with k8stools 2.3.0.

# Which environment references are real dependencies. Drafted 2026-10-03 from
# every env value naming another Service (a broader rule than the generator's,
# which only reads *_ADDR/*_URL-style names), one comment per edge naming the
# variable it came from. NOT YET REVIEWED: a person confirms each edge, then
# fills in `reviewed`. Until then the eval reports this truth as unreviewed.
# Decided 2026-10-03 (jfischer): routing and tooling edges count as dependencies --
# frontend-proxy's routes to UIs and the load generator, and load-generator's
# traffic into frontend-proxy. flagd is left out: callers fall back to default
# flag values when it is unreachable. prometheus is left out too: edges into it
# are observability reading observability (jaeger's UI queries it for metrics),
# not the request path.
ignore_dependencies: [otel-collector, kubernetes, flagd, prometheus]   # telemetry export; the API server; feature flags; metrics store
reviewed: null
dependencies:
  accounting:
    - kafka                # KAFKA_ADDR
    - postgresql         # DB_CONNECTION_STRING (Host=...)
  ad:
    - flagd                # FLAGD_HOST
  cart:
    - flagd                # FLAGD_HOST
    - valkey-cart          # VALKEY_ADDR
  checkout:
    - cart                 # CART_ADDR
    - currency             # CURRENCY_ADDR
    - email                # EMAIL_ADDR
    - flagd                # FLAGD_HOST
    - kafka                # KAFKA_ADDR
    - payment              # PAYMENT_ADDR
    - product-catalog      # PRODUCT_CATALOG_ADDR
    - shipping             # SHIPPING_ADDR
  email:
    - flagd                # FLAGD_HOST
  fraud-detection:
    - flagd                # FLAGD_HOST
    - kafka                # KAFKA_ADDR
  frontend:
    - ad                   # AD_ADDR
    - cart                 # CART_ADDR
    - checkout             # CHECKOUT_ADDR
    - currency             # CURRENCY_ADDR
    - flagd                # FLAGD_HOST
    - product-catalog      # PRODUCT_CATALOG_ADDR
    - product-reviews      # PRODUCT_REVIEWS_ADDR
    - recommendation       # RECOMMENDATION_ADDR
    - shipping             # SHIPPING_ADDR
  frontend-proxy:
    - flagd                # FLAGD_HOST
    - frontend             # FRONTEND_HOST
    - grafana              # GRAFANA_HOST
    - image-provider       # IMAGE_PROVIDER_HOST
    - jaeger               # JAEGER_HOST
    - load-generator       # LOCUST_WEB_HOST
  jaeger:
    - prometheus           # PROMETHEUS_ADDR
  llm:
    - flagd                # FLAGD_HOST
  load-generator:
    - flagd                # FLAGD_HOST
    - frontend-proxy       # LOCUST_HOST
  otel-collector-agent:
    - jaeger             # config otel-collector-agent/exporters.otlp/jaeger
    - opensearch         # config otel-collector-agent/exporters.opensearch
  payment:
    - flagd                # FLAGD_HOST
  product-catalog:
    - flagd                # FLAGD_HOST
    - postgresql           # DB_CONNECTION_STRING
  product-reviews:
    - flagd                # FLAGD_HOST
    - llm                  # LLM_HOST
    - postgresql         # DB_CONNECTION_STRING (host=...)
    - product-catalog      # PRODUCT_CATALOG_ADDR
  recommendation:
    - flagd                # FLAGD_HOST
    - product-catalog      # PRODUCT_CATALOG_ADDR
  shipping:
    - quote                # QUOTE_ADDR

# Kinds, scored only when the wiki is synthesised (`k8srca eval arch --model`).
# Drafted 2026-10-04 by reading the docs, before comparing with a model's answer.
# NOT YET REVIEWED as a whole, with the dependencies above. Decided 2026-10-04
# (jfischer): valkey-cart is a cache (one the cart cannot bypass, so its edge is
# not soft); frontend is a ui; opensearch is telemetry (a datastore, but for
# telemetry).
kinds:
  accounting: service
  ad: service
  cart: service
  checkout: service
  currency: service
  email: service
  flagd: feature-flags
  fraud-detection: service
  frontend-proxy: gateway
  frontend: ui
  grafana: ui
  image-provider: service
  jaeger: telemetry
  kafka: queue
  kubernetes: external
  llm: service
  load-generator: load-generator
  opensearch: telemetry
  otel-collector: telemetry
  postgresql: datastore
  product-catalog: service
  product-reviews: service
  prometheus: telemetry
  quote: service
  recommendation: service
  shipping: service
  valkey-cart: cache
# "soft": the caller carries on without the target. Decided 2026-10-04 (jfischer):
# every frontend-proxy edge is a route -- the docs call it a reverse proxy for
# the user-facing interfaces, and Envoy keeps serving other paths when one
# upstream is down.
edge_kinds:
  accounting -> kafka: async-event
  ad -> flagd: feature-flags soft
  cart -> flagd: feature-flags soft
  cart -> valkey-cart: cache
  checkout -> cart: sync-call
  checkout -> currency: sync-call
  checkout -> email: sync-call
  checkout -> flagd: feature-flags soft
  checkout -> kafka: async-event
  checkout -> payment: sync-call
  checkout -> product-catalog: sync-call
  checkout -> shipping: sync-call
  email -> flagd: feature-flags soft
  fraud-detection -> flagd: feature-flags soft
  fraud-detection -> kafka: async-event
  frontend -> ad: sync-call
  frontend -> cart: sync-call
  frontend -> checkout: sync-call
  frontend -> currency: sync-call
  frontend -> flagd: feature-flags soft
  frontend -> product-catalog: sync-call
  frontend -> product-reviews: sync-call
  frontend -> recommendation: sync-call
  frontend -> shipping: sync-call
  frontend-proxy -> grafana: route
  frontend-proxy -> jaeger: route
  frontend-proxy -> load-generator: route
  llm -> flagd: feature-flags soft
  load-generator -> flagd: feature-flags soft
  load-generator -> frontend-proxy: load
  payment -> flagd: feature-flags soft
  product-catalog -> flagd: feature-flags soft
  product-catalog -> postgresql: datastore
  product-reviews -> flagd: feature-flags soft
  product-reviews -> llm: sync-call
  product-reviews -> product-catalog: sync-call
  recommendation -> flagd: feature-flags soft
  recommendation -> product-catalog: sync-call
  shipping -> quote: sync-call
  frontend-proxy -> flagd: route
  frontend-proxy -> frontend: route
  frontend-proxy -> image-provider: route
  accounting -> postgresql: datastore
  product-reviews -> postgresql: datastore
  otel-collector-agent -> jaeger: telemetry soft
  otel-collector-agent -> opensearch: telemetry soft

# Where this truth and the demo's own diagram (case.yaml `reference`) disagree,
# and why. Drafted 2026-10-04 from each component's env and the docs; reviewed
# with the rest of this file. A difference not listed here is reported by the eval.
reference_differences:
  checkout -> flagd: >-
    FLAGD_HOST; the diagram draws flagd for some services only
  email -> flagd: >-
    FLAGD_HOST; the diagram draws flagd for some services only
  frontend -> flagd: >-
    FLAGD_HOST; the diagram draws flagd for some services only
  frontend-proxy -> grafana: >-
    GRAFANA_HOST; frontend-proxy.md names Grafana among the UIs it proxies
  frontend-proxy -> jaeger: >-
    JAEGER_HOST; frontend-proxy.md names Jaeger among the UIs it proxies
  frontend-proxy -> load-generator: >-
    LOCUST_WEB_HOST; frontend-proxy.md names the load generator's UI among those it proxies
  jaeger -> prometheus: >-
    PROMETHEUS_ADDR; the diagram leaves out the telemetry backends
  llm -> product-reviews: >-
    not in the truth: llm names no product-reviews address; the diagram's arrow is the reverse of product-reviews -> llm (LLM_HOST)
  load-generator -> flagd: >-
    FLAGD_HOST; the diagram draws flagd for some services only
  product-catalog -> flagd: >-
    FLAGD_HOST; the diagram draws flagd for some services only
  product-catalog -> postgresql: >-
    DB_CONNECTION_STRING names postgresql; the diagram does not draw it
  otel-collector-agent -> jaeger: >-
    the collector's traces exporter (config, not env); the diagram leaves out the telemetry backends
  otel-collector-agent -> opensearch: >-
    the collector's logs exporter (config, not env); the diagram leaves out the telemetry backends

# Where this truth and this install's traces (case.yaml `traces`) disagree, and
# why. Drafted 2026-10-04; reviewed with the rest of this file. A truth edge
# with no traced calls stays in the truth: it is wired, and a path quiet in the
# window is still one that can fail.
trace_differences:
  frontend -> ad: >-
    ad is crash-looping in this install (CrashLoopBackOff, exit 137 ten seconds
    after each start, ~4,000 restarts), so it emits no spans at all; the load
    generator does request ads (/api/data/ in its 2.2.0 locustfile)
  frontend -> shipping: >-
    called only from /api/shipping, which the browser's cart page requests; the
    load generator never does (2.2.0 locustfile, frontend Shipping.gateway.ts)
  frontend-proxy -> grafana: >-
    a UI route; nobody opened Grafana in the window
  frontend-proxy -> load-generator: >-
    a UI route; nobody opened the Locust UI in the window
  otel-collector-agent -> jaeger: >-
    telemetry export: a collector does not trace its own exports
  product-reviews -> llm: >-
    llm is not instrumented (no OpenTelemetry in its 2.2.0 source; it runs as
    plain python), so its calls never form a traced dependency, though the load
    generator asks the AI assistant
  product-reviews -> product-catalog: >-
    only through the fetch_product_info tool call, which the mock LLM never
    requests (it asks only for fetch_product_reviews); a real LLM may
