# Written against the capture below and only that one. Re-recording moves the
# restart count, the container lifetime and the offsets every disposition here
# cites, so `k8srca scenario list` refuses to grade until this is re-reviewed
# and capture.captured_at is updated (004 §6.3).
id: jvm-oom-on-startup
capture:
  captured_at: '2026-09-20T00:53:33.141543+00:00'

cause:
  summary: >-
    The ad container's memory limit equals its request (300Mi) with no JVM heap
    sizing, so the JVM's default heap sizing exceeds the cgroup limit and the
    kernel kills the process. The container never reaches readiness, so the pod
    sits in CrashLoopBackOff having restarted 1961 times.
  # Word-boundary matched, so short names are safe to require.
  must_identify: [ad, memory, 300Mi]

rivals:
  - id: memory-leak
    disposition: weakened
    note: >-
      The container lives about 173 seconds before being killed (last_state
      offsets 371s -> 198s before capture) and dies during JVM startup, before
      the SLF4J provider warnings resolve. That is short for a leak, but it is
      not the ~2s the original design assumed -- weakened rather than refuted,
      and an answer that calls it refuted on timing alone is overreaching.
  - id: workload-spike
    disposition: refuted
    note: >-
      The container never becomes ready, so it serves no traffic at all. No
      request can have driven the memory up.
  - id: node-pressure
    disposition: refuted
    note: >-
      Node `minikube` reports MemoryPressure=False and Ready=True, with 64Gi
      capacity against a 300Mi limit. The kill is the cgroup limit, not the node.

traps:
  - id: reason-says-error
    expect: flagged
    note: >-
      last_state.reason is "Error", not "OOMKilled", though exit_code is 137
      (SIGKILL). The conclusion is still right, but asserting that the OOM
      killer fired without noting that the reason field disagrees is the
      failure this scenario exists to catch.
  - id: previous-logs-are-the-same-instance
    expect: avoided
    note: >-
      While the container sits in CrashLoopBackOff there is no running instance,
      so the kubelet serves the same most-recently-terminated one for both
      `previous=True` and `previous=False` -- the two calls return identical
      bytes. Treating them as two independent pieces of evidence, or as
      "the previous instance logged the same thing, so this is reproducible",
      is double-counting one observation. See k8stools#6 part 3.
  - id: fraud-detection-is-a-separate-failure
    expect: avoided
    note: >-
      `fraud-detection` is also crash-looping (2215 restarts) with the same
      limit == request shape. It is an independent instance of the same
      misconfiguration, not a cause, a consequence, or evidence of a
      cluster-wide event. Tying the two together causally is wrong.

gaps:
  - id: no-metrics
    expect: reported_unavailable
    note: >-
      There is no metrics source in this scenario, so actual heap usage over
      time cannot be shown. An answer that states a peak heap figure has
      invented it; one that says memory usage could not be measured is correct.
