# Written against the capture AND the skill bundle pinned beside it, and only
# those. Both are observed reads of one cluster taken 1s apart; re-recording
# moves the restart count, the container lifetime and every offset cited below,
# so `k8srca scenario list` refuses to grade until this is re-reviewed and both
# digests are updated (004 §6.3).
id: jvm-oom-on-startup
capture:
  captured_at: '2026-09-27T21:56:53.065258+00:00'
  # The cluster-architecture skill is a second observed read of the same
  # cluster, not supplementary context, so it is pinned with the same force as
  # the capture. Skew at record time: 1s.
  skill_digest: 8bc956c2cd179cf3

cause:
  summary: >-
    The ad container's memory limit equals its request (300Mi) with no JVM heap
    sizing, so the JVM's default heap sizing exceeds the cgroup limit and the
    kernel kills the process during startup. The container never reaches
    readiness, so the pod sits in CrashLoopBackOff having restarted 2529 times.
  must_identify: [ad, memory, 300Mi]

rivals:
  # Two levels, because the KB presents two and the symptom is the outer one.
  #
  # Earlier versions listed only OOMKilled's sub-causes and graded every run 0/6
  # for five batches. The agent was dispositioning CrashLoopBackOff's four
  # candidates -- correctly, that is the observed symptom -- and getting no
  # credit, while the level being graded had no path to it: `related` is a
  # correlation graph and nothing linked the "OOM" hypothesis to the OOMKilled
  # alert that decomposes it. That link now exists (`refines`), so the descent is
  # prompted and can fairly be expected; the outer level is graded because the
  # agent was already doing it.

  # --- CrashLoopBackOff: the symptom actually observed ---
  - id: application-crash
    disposition: refuted
    note: >-
      The container is killed with exit 137 and logs nothing of its own before
      the cut -- no exception, no stack trace, no fatal error. A process that
      failed on its own would have said so and exited with its own code.
  - id: bad-config
    disposition: could_not_check
    note: >-
      Nothing in the logs names a missing or invalid setting, and the workload
      spec has not changed for months. But a ConfigMap or Secret edit leaves no
      ReplicaSet revision, so "the workload is unchanged" does not establish that
      the configuration is. An answer that refutes this outright is claiming more
      than the capture supports; one that reports it as unverifiable is right.
  - id: failed-liveness-probe
    disposition: refuted
    note: >-
      No probes are configured on the container at all, which rules this out
      outright rather than weakening it.
  - id: oom
    disposition: confirmed
    note: >-
      Exit 137 with no self-reported error, on a container whose memory limit
      equals its request. This is the hypothesis that survives, and surviving is
      what obliges the answer to say *which kind* of OOM -- see the sub-causes
      below.

  # --- OOMKilled: the sub-causes of the hypothesis that survived ---
  - id: memory-limit-too-low
    disposition: confirmed
    note: >-
      Limit equals request at 300Mi with no JVM heap flags set, and the container
      is killed on every restart including the first, with no period of healthy
      operation.
  - id: memory-leak
    disposition: weakened
    also_accept: [refuted]
    note: >-
      The container is killed during startup, before it completes initialisation,
      on every restart including the first -- so there is no period of operation
      in which anything could accumulate. Weakened is right if the answer rests
      on the missing memory time series; refuted is right if it rests on there
      being no operating period to leak over. Both are sound readings of this
      capture. Earlier versions demanded weakened only, and 4 of 6 runs lost the
      dimension for refuting it on exactly that second argument.
  - id: workload-spike
    disposition: refuted
    note: >-
      The container never reaches readiness, so it served no traffic at all and
      no request can have driven its memory up.

traps:
  - id: reason-says-error
    expect: flagged
    note: >-
      last_state.reason is "Error", not "OOMKilled", though exit_code is 137
      (SIGKILL). The conclusion is still right, but asserting that the OOM
      killer fired without noting that the reason field disagrees is the
      failure this scenario exists to catch.
  - id: shared-limit-is-a-common-cause-not-a-dependency
    expect: avoided
    note: >-
      `fraud-detection` is also crash-looping (2862 restarts, ~2s lifetime) with
      the same limit == request shape. What is wrong is claiming a *dependency* --
      that `ad` fails because `fraud-detection` is down, or the reverse. They are
      independent services and neither calls the other on the startup path.

      Noting that they share a *common cause* is not the error, and an earlier
      version of this trap wrongly forbade it. Exactly two containers in the
      cluster carry a 300Mi limit and they are exactly the two that are
      crash-looping; every other container has a different limit and every one
      of them is Running. "The 300Mi services are under-provisioned, this is not
      an ad-specific bug" is the best-supported inference in the capture, and
      an answer that reaches it is doing better than one that does not.
  - id: accounting-is-a-different-severity-not-a-third-crash-loop
    expect: avoided
    note: >-
      `accounting` runs on a 120Mi limit, reaches readiness, serves for a while,
      is killed for memory and restarts -- 443 restarts at capture time, exit code
      137, and `1/1` ready. It is genuinely memory-pressured, so "three services
      here are memory-starved" is correct and an earlier version of this trap
      wrongly forbade it. The interval between kills has been roughly 13, 23 and
      61 minutes across captures, so it is not a fixed cycle; and its
      `last_state.reason` has read both `OOMKilled` and `Error`, which is the same
      unreliability the `reason-says-error` trap turns on.

      What is wrong is flattening the severities: calling it a third crash loop,
      or treating it as failing the same way `ad` and `fraud-detection` do. Those
      two die during startup and never become ready; this one completes startup
      and does useful work between kills. Its symptom is consumer lag, not an
      outage, and an answer that cannot tell those apart has not understood
      either.

gaps:
  - id: no-metrics
    expect: reported_unavailable
    note: >-
      There is no metrics source in this scenario, so actual heap usage over
      time cannot be shown. An answer that states a peak heap figure has
      invented it; one that says memory usage could not be measured is correct.

# Renamed and re-scoped: `fraud-detection-is-a-separate-failure` became
# `shared-limit-is-a-common-cause-not-a-dependency`. The original forbade
# treating the two crash loops as evidence of a cluster-wide condition, which
# the capture supports at 2 of 2 -- so it failed answers for making the
# strongest available inference. It passed 6/6 in the baselined run and had
# failed earlier batches, i.e. it was a latent false-failure generator rather
# than a live one.
#
# Removed on re-record: `previous-logs-are-the-same-instance`. It required the
# container to be sitting in backoff at the instant of capture, when the kubelet
# serves the same terminated instance for both `previous=True` and `False`. The
# previous capture had that; this one does not (logs != previous_logs). A trap
# that depends on catching a transient state does not survive re-recording, so
# it cannot live in a scenario authored by §4.1 capture -- it needs KWOK (§4.3).
