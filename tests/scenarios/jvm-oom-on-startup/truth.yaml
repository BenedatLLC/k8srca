# Written against the capture AND the skill bundle pinned beside it, and only
# those. Both are observed reads of one cluster taken 1s apart; re-recording
# moves the restart count, the container lifetime and every offset cited below,
# so `k8srca scenario list` refuses to grade until this is re-reviewed and both
# digests are updated (004 §6.3).
id: jvm-oom-on-startup
capture:
  captured_at: '2026-09-30T14:35:06.887261+00:00'
  # The cluster-architecture skill is a second observed read of the same
  # cluster, not supplementary context, so it is pinned with the same force as
  # the capture. Skew at record time: 1s.
  skill_digest: 67948880870e892c

cause:
  summary: >-
    The ad container's memory limit equals its request (300Mi) with no JVM heap
    sizing, so the JVM's default heap sizing exceeds the cgroup limit and the
    kernel kills the process seconds after it starts -- the current instance
    after 8 seconds, the previous one after 9 -- before it logs anything beyond
    its startup banner. It has restarted 3200 times. At the moment of capture
    it has just been killed (Terminated 19s earlier, not yet waiting in
    back-off).
  must_identify: [ad, memory, 300Mi]

rivals:
  # Two levels, because the KB presents two and the symptom is the outer one.
  #
  # Earlier versions listed only OOMKilled's sub-causes and graded every run 0/6
  # for five batches. The agent was dispositioning CrashLoopBackOff's four
  # candidates -- correctly, that is the observed symptom -- and getting no
  # credit, while the level being graded had no path to it: `related` is a
  # correlation graph and nothing linked the "OOM" hypothesis to the OOMKilled
  # alert that decomposes it. That link now exists (`refines`), so the descent is
  # prompted and can fairly be expected; the outer level is graded because the
  # agent was already doing it.

  # --- CrashLoopBackOff: the symptom actually observed ---
  - id: application-crash
    disposition: refuted
    note: >-
      The container is killed with exit 137 and logs nothing of its own before
      the cut. The current instance logs seven lines -- javaagent banner, "Ad
      service starting", three SLF4J warnings -- over 4.7 seconds and then
      nothing for the ~3 seconds until it is killed: no exception, no stack
      trace, no fatal error. A process that failed on its own would have said so
      and exited with its own code.
  - id: bad-config
    disposition: weakened
    also_accept: [could_not_check]
    note: >-
      Nothing in the logs names a missing or invalid setting, and the workload
      history shows ad references no ConfigMap or Secret: its whole
      configuration is its pod template, unchanged for 163 days apart from that
      revision's image upgrade and one removed env var. That weakens a
      configuration cause. It does not refute it: ad reads feature flags from
      flagd, and a flag toggle leaves no revision or write anywhere here.
      Weakened on that evidence is right; so is could_not_check from an answer
      that says flag state is unverifiable. Refuted claims more than the
      capture supports.
  - id: failed-liveness-probe
    disposition: refuted
    note: >-
      No probes are configured on the container at all, which rules this out
      outright rather than weakening it.
  - id: oom
    disposition: confirmed
    note: >-
      Exit 137 with no self-reported error, on a container whose memory limit
      equals its request. This is the hypothesis that survives, and surviving is
      what obliges the answer to say *which kind* of OOM -- see the sub-causes
      below.

  # --- OOMKilled: the sub-causes of the hypothesis that survived ---
  - id: memory-limit-too-low
    disposition: confirmed
    note: >-
      Limit equals request at 300Mi with no JVM heap flags set. It has been
      killed on every restart since the cluster last started (see
      `event-window-is-not-onset`), with lives of 8 and 9 seconds in the two
      instances the capture shows, and never logs past its startup banner.
      `fraud-detection`, the only other container with a 300Mi limit, is dying
      the same way after 2 seconds.
  - id: memory-leak
    disposition: weakened
    also_accept: [refuted]
    note: >-
      The current instance was killed 8 seconds after it started and the
      previous one after 9, and every instance dies without logging past
      startup -- there is no period of operation in which anything could
      accumulate. Weakened is right if the answer rests on the missing memory
      time series; refuted is right if it rests on there being no operating
      period to leak over. Both are sound readings of this capture.
  - id: workload-spike
    disposition: refuted
    also_accept: [weakened]
    note: >-
      A spike is a change, and this failure has no observable onset: the
      container has been killed on every restart since the cluster last
      started ~3d20h ago, and its restart count shows days of looping before
      that. Its lives last seconds. The architecture skill documents
      load-generator as the only traffic source, synthetic and roughly
      constant. Refuted on those grounds is right. Weakened is also right if the
      answer says request rate cannot be measured here. Whether the process
      accepted any requests in its seconds of life is not in the capture, so
      "it never served traffic" is an inference, not an observation -- a
      refutation resting on it alone still has the right verdict.

traps:
  - id: reason-says-error
    expect: flagged
    note: >-
      Both the current state and last_state read reason "Error", not
      "OOMKilled", though exit_code is 137 (SIGKILL). The conclusion is still
      right, but asserting that the OOM killer fired without noting that the
      reason field disagrees is the failure this scenario exists to catch.
  - id: previous-log-is-a-kubelet-error
    expect: avoided
    note: >-
      The previous instance's log is a single line, "unable to retrieve
      container logs for docker://c64b40c2...": the kubelet's error message,
      returned in place of a log it no longer has. It is not anything the
      container printed. Wrong: quoting it as the previous instance's output,
      or reading it as the process failing with a log or runtime error, or as
      proof the previous instance logged nothing. Right: the previous
      instance's log is unavailable, and the evidence is the current
      instance's log.
  - id: restart-cadence-is-not-lifetime
    expect: avoided
    note: >-
      Three durations, easily confused. Each instance runs for seconds (8 and 9,
      `ran_for`). The current instance's log covers 4.7 seconds. The restarts
      come about every 5.8 minutes: the previous kill was 334s before capture
      and the current start 307s later (the kubelet's 5m back-off), and the
      `Pulled` event for the pod has a count of 955 over about 3 days 20 hours,
      one per ~348s. An answer that states the restart interval as seconds, or
      as "every minute", fails; one that gives ~5-6 minutes, or does not state
      a cadence, passes. The `Created` event's last_seen is 22 minutes old while
      `Pulled` was 27s ago -- event records lag what they count (k8stools
      documents this) -- so reading "the last restart was 22 minutes ago" from
      it is also wrong.
  - id: event-window-is-not-onset
    expect: avoided
    note: >-
      Every event record for `ad` starts ~3d20h (332,557s) before capture, and
      so does the current life of every healthy container in the cluster: the
      cluster last started then (their previous lives ran ~34h, so it restarts
      periodically). The events show ad looping for that whole window -- 955
      `Pulled` at one per ~348s fills it exactly -- so "looping continuously for
      ~3d20h" is right. What is wrong is "the crash loop started ~3d20h ago":
      3200 restarts at that cadence is ~12.9 days of looping, so it was looping
      before the window began. And "since it was deployed 163 days ago" is not
      established either: the pod is that old, but the cluster has not been
      running all that time, and nothing here says whether ad looped in every
      period it was up. An answer that takes `first_seen` as the onset fails;
      one that dates the loop to deployment asserts more than the capture
      shows, but is graded on evidence, not here.

      Noting that all pods restarted together ~3d20h ago is correct -- it is
      the cluster starting -- and ad and fraud-detection are the two that
      went straight back into a loop.
  - id: shared-limit-is-a-common-cause-not-a-dependency
    expect: avoided
    note: >-
      `fraud-detection` is also crash-looping (3613 restarts, 2s lifetime,
      waiting in back-off at capture) with the same limit == request shape. What
      is wrong is claiming a *dependency* -- that `ad` fails because
      `fraud-detection` is down, or the reverse. They are independent services
      and neither calls the other on the startup path.

      Noting that they share a *common cause* is not the error, and an earlier
      version of this trap wrongly forbade it. Exactly two containers in the
      cluster carry a 300Mi limit and they are exactly the two that are
      crash-looping; every other container has a different limit and is Running
      without an ongoing loop. "The 300Mi services are under-provisioned, this
      is not an ad-specific bug" is the best-supported inference in the capture,
      and an answer that reaches it is doing better than one that does not.
  - id: accounting-is-a-different-severity-not-a-third-crash-loop
    expect: avoided
    note: >-
      `accounting` runs on a 120Mi limit, reaches readiness, serves for a while,
      is killed for memory and restarts -- 578 restarts at capture time, exit code
      137, and `1/1` ready. It is genuinely memory-pressured, so "three services
      here are memory-starved" is correct and an earlier version of this trap
      wrongly forbade it. Its last life ran about 9 minutes (562s); across
      captures the interval has been roughly 9, 11, 13, 23 and 61 minutes, so it
      is not a fixed cycle. Its `last_state.reason` has read both `OOMKilled`
      and `Error`, the same unreliability the `reason-says-error` trap turns on.

      What is wrong is flattening the severities: calling it a third crash loop,
      or treating it as failing the same way `ad` and `fraud-detection` do. Those
      two die within seconds and never log past startup; this one completes
      startup and does useful work between kills. Its symptom is consumer lag,
      not an outage, and an answer that cannot tell those apart has not
      understood either.

gaps:
  - id: no-metrics
    expect: reported_unavailable
    note: >-
      There is no metrics source in this scenario, so actual heap usage over
      time cannot be shown, and neither can request rate. An answer that states
      a peak heap figure has invented it; one that says memory usage could not
      be measured is correct.

# 2026-10-07: the capture gained workload histories (k8stools 2.4.0), read
# afterwards and shifted to captured_at by `k8srca scenario backfill-histories`,
# which refuses anything newer than the capture; nothing else in it changed.
# They show ad references no ConfigMap or Secret, so `bad-config` now rests on
# that (weakened, with could_not_check still accepted: the same accepted set as
# before, so earlier batches' grades on it stay comparable).
#
# Re-recorded 2026-09-30, because the architecture skill carried a false note:
# docs/architecture/otel-demo/accounting.md said ad and fraud-detection "never
# reach readiness at all", and five of six runs on the previous capture said
# it (one quoted it). ad has no readiness probe, so that was never a property
# of the service. The note's behaviour paragraph was removed rather than
# reworded: it described current failure behaviour, which the live cluster
# states and the notes' own scope leaves to it.
#
# Removed: `ready-now-is-not-recovered`. This capture caught ad just killed --
# Terminated, not ready -- so the half about its current state is now true,
# and the other half ("never becomes ready") rests on Kubernetes semantics the
# capture cannot show. Same fate as `previous-logs-are-the-same-instance`
# below: a trap tied to the instant of capture.
#
# Added: `previous-log-is-a-kubelet-error`. The previous instance's log was
# reclaimed, and the kubelet answers with an error string in its place.
#
# Re-recorded 2026-09-29 against k8stools 2.2.0, which adds event `count` and
# `first_seen` -- the reason for re-recording, since the previous capture
# predates them and replays them as None.
#
# This capture caught `ad` Running and ready rather than in back-off. That
# broke the previous version's central argument: "the container never reaches
# readiness, so it served no traffic" was used to refute workload-spike and to
# weaken memory-leak, and answers routinely repeated it. It was never a
# property of the failure -- with no readiness probe a container is ready the
# moment it starts -- only of the instant the previous capture was taken. The
# arguments above now rest on facts that hold at any instant: kills on every
# restart since deployment, lives of seconds, a log that stops at the same
# line. Catching the old claim is the new `ready-now-is-not-recovered` trap.
#
# Also new: `restart-cadence-is-not-lifetime`, gradeable now that events carry
# counts. Answers had been reporting a ~6-minute restart cycle as "every
# minute".
#
# Corrected after the first full batch (6 runs): bad-config takes
# `also_accept: [weakened]` -- five of six runs weakened it with exactly the
# reasoning the note endorses, and the grader passed four of those and failed
# one, which is the truth being ambiguous, not the agent being wrong. And
# `ready-now-is-not-recovered` now fails only claims about Kubernetes state:
# it had also counted "never served traffic" as false, which the capture
# cannot check.
#
# Corrected after the first two runs: this version first said ad had been
# killed "on every restart since deployment 162 days ago". Nothing supports
# that. The cluster last started 2d10h ago and 2846 restarts is ~11.5 days of
# looping, so the loop's onset is unknown. The grader followed the truth and
# marked a correct "looping continuously for ~2d10h" as unsupported. The
# misreading an answer *can* make here -- taking event `first_seen` as the
# onset -- is now `event-window-is-not-onset`.
#
# Renamed and re-scoped: `fraud-detection-is-a-separate-failure` became
# `shared-limit-is-a-common-cause-not-a-dependency`. The original forbade
# treating the two crash loops as evidence of a cluster-wide condition, which
# the capture supports at 2 of 2 -- so it failed answers for making the
# strongest available inference. It passed 6/6 in the baselined run and had
# failed earlier batches, i.e. it was a latent false-failure generator rather
# than a live one.
#
# Removed on re-record: `previous-logs-are-the-same-instance`. It required the
# container to be sitting in backoff at the instant of capture, when the kubelet
# serves the same terminated instance for both `previous=True` and `False`. The
# previous capture had that; this one does not (logs != previous_logs). A trap
# that depends on catching a transient state does not survive re-recording, so
# it cannot live in a scenario authored by §4.1 capture -- it needs KWOK (§4.3).
