# Scenario 1 (design 004 §5). Vehicle: a JVM with limit == request and no heap
# sizing. Discriminates: handling evidence that contradicts the hypothesis.
id: jvm-oom-on-startup
question: |
  The ad service is crash-looping in the default namespace. Why?
sources:
  k8stools:
    state: k8s.json
    # Frozen so repeated runs are identical. 004 §11.4 wants one A/B against
    # `advancing` before we assume freezing does not change behaviour.
    clock: frozen
budget:
  # Set from measurement, not estimate. Thirteen runs on this capture:
  #   tool calls  mean 31, sd 7.7, range 19-44   -> gates
  #   cost        mean $0.40, sd $0.16, range $0.25-$0.85 -> advisory only
  # Cost varied 3.4x against 2.3x for calls, and the run with the tightest call
  # spread had the widest cost spread: cost tracks thinking and delegation, not
  # tool use, so a dollar cap fails correct answers on an expensive day. It is
  # reported on every run and gates none.
  max_tool_calls: 50
  max_usd: 0.70

follow_up: |
  Was anything deployed recently that could explain it?
