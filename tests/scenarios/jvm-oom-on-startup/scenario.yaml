# Scenario 1 (design 004 §5). Vehicle: a JVM with limit == request and no heap
# sizing. Discriminates: handling evidence that contradicts the hypothesis.
id: jvm-oom-on-startup
question: |
  The ad service is crash-looping in the default namespace. Why?
sources:
  k8stools:
    state: k8s.json
    # Frozen so repeated runs are identical. 004 §11.4 wants one A/B against
    # `advancing` before we assume freezing does not change behaviour.
    clock: frozen
budget:
  # Set from measurement, not estimate. Seven runs on this capture:
  #   tool calls  mean 30, sd 8.1, max 43   -> mean+2sd = 46
  #   cost        mean $0.35, sd $0.10, max $0.55 -> mean+2sd = $0.55
  # The estimate-derived budgets before this (25/$0.25, then 35/$0.40) failed
  # four of seven runs that had answered correctly, which is the wrong reason
  # for a scenario to go red -- it hides the dimensions that matter behind a
  # harness limit. These sit above mean+2sd with headroom, so a failure here
  # means the agent genuinely ran away rather than that it was a slow day.
  max_tool_calls: 50
  max_usd: 0.70

follow_up: |
  Was anything deployed recently that could explain it?
