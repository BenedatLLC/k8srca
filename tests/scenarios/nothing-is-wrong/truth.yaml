# Written against the capture of 2026-10-15 and the wiki pinned beside it.
# Our own install, so the wiki is built from k8srca.yaml's sources, as in
# jvm-oom-on-startup.
#
# What the capture shows, and what this truth rests on:
# - checkout and every service it calls synchronously (cart, currency, email,
#   payment, product-catalog, shipping; the wiki's sync-call edges) are
#   Running and Ready. Each has 16 restarts, as has nearly every pod in the
#   cluster: their previous lives ran ~3 days and ended together ~4.9 days
#   before capture (exit 255) -- the cluster stopping, not the services
#   failing. product-catalog has 40: its previous life lasted 5s at that same
#   start (exit 1) and it has run since.
# - The only Warning events are BackOff for ad and fraud-detection.
# - ad and fraud-detection crash-loop (exit 137, ~5,955 and ~6,723 restarts);
#   accounting is OOM-killed and restarted (1,038 restarts, last exit 137 about
#   a minute before capture). These are the long-standing faults
#   jvm-oom-on-startup is about.
# - frontend's log is full of `14 UNAVAILABLE ... ECONNREFUSED
#   10.106.129.133:8080`. That is ad's ClusterIP: frontend failing to fetch ads.
# - checkout's container log is empty, current and previous, as are
#   product-catalog's and shipping's: they export logs through OpenTelemetry,
#   not stdout.
# - No container on checkout's path has a CPU limit; no PVC exists in the
#   cluster; the single node is Ready with 16 CPUs and no pressure condition.
id: nothing-is-wrong
capture:
  captured_at: '2026-10-15T01:20:36.032486+00:00'
  skill_digests:
    wiki: 4df3e920e4cba77d        # reviewed 2026-10-15

cause:
  summary: >-
    Nothing in the cluster explains checkout being slow, and slowness itself
    cannot be observed here: there is no metrics or trace backend, and
    checkout writes no container logs. Checkout and every service it calls
    synchronously are Running and Ready with no restarts beyond the cluster's
    own restart ~4.9 days ago, and no events. The visible breakage -- ad and
    fraud-detection crash-looping, accounting being OOM-killed -- is not on
    checkout's request path. The right answer says it found no cause, says
    what it checked, and says what would settle it (latency data, traces, or
    when users noticed).
  must_identify: [checkout]

rivals:
  # The union of what `kb_query.py lookup` gives for HighRequestLatency and
  # ServiceLatencyHigh, the two entries a search for slow requests returns.
  # None has an authored discriminator; the answer has to form its own.
  - id: cpu-throttling
    disposition: refuted
    also_accept: [weakened]
    note: >-
      No container on checkout's path has a CPU limit -- requests and limits
      set memory only -- and throttling is enforcement of a CPU limit. The
      node has 16 CPUs and no pressure condition. Refuted on the spec is
      right; weakened is right if the answer also leans on the missing CPU
      metrics. could_not_check misses evidence the spec holds.
  - id: downstream-latency
    disposition: weakened
    also_accept: [could_not_check]
    note: >-
      Every synchronous dependency is Running and Ready with no restarts
      since the cluster started and no events. That weakens it; it cannot
      refute it, because a Running service can still be slow and there is no
      latency data. Refuted claims more than the capture shows.
  - id: dns-network-latency
    disposition: could_not_check
    also_accept: [weakened]
    note: >-
      Nothing measures DNS or network latency here. CoreDNS is Running;
      currency logged an OTLP exporter DNS failure for otel-collector, but at
      startup ~4.9 days ago, and that is telemetry export, not checkout's path.
      Weakened on CoreDNS being healthy is acceptable.
  - id: storage-latency
    disposition: weakened
    also_accept: [refuted, could_not_check]
    note: >-
      There are no PersistentVolumeClaims in the cluster, so nothing on
      checkout's path sits on a persistent volume. Node disk I/O is not
      measurable here. Any of the three is a sound reading.

traps:
  - id: blames-the-visible-crash-loops
    expect: avoided
    note: >-
      ad and fraud-detection are crash-looping and accounting is being
      OOM-killed, and none is on checkout's synchronous path: checkout calls
      cart, currency, email, payment, product-catalog and shipping; frontend,
      not checkout, calls ad. Mentioning them as unrelated breakage is good;
      naming any of them as the cause, or a likely contributor, of checkout
      latency fails.
  - id: kafka-consumers-do-not-slow-the-producer
    expect: avoided
    note: >-
      checkout publishes orders to kafka (the wiki's async-event edge);
      fraud-detection and accounting consume them. Kafka is Running and Ready.
      A consumer that is down leaves messages unread; it does not slow the
      producer. Claiming checkout is slowed by a Kafka backlog or
      back-pressure from the failing consumers fails.
  - id: frontend-errors-are-ad
    expect: avoided
    note: >-
      frontend logs repeated `14 UNAVAILABLE ... ECONNREFUSED
      10.106.129.133:8080`. That address is the ad Service's ClusterIP: these
      are failed ad fetches. Reading them as checkout or payment failures, or
      as evidence about checkout's latency, fails.
  - id: restart-counts-are-the-cluster-restarting
    expect: avoided
    note: >-
      Nearly every pod shows 16 restarts, with previous lives of ~3 days ending
      together ~4.9 days before capture: the cluster stopped and started.
      Reading checkout's or its dependencies' restart counts as instability
      fails.

gaps:
  - id: no-latency-data
    note: >-
      There is no metrics or trace backend, so checkout's latency cannot be
      measured, and neither can whether it is slow at all. The answer must say
      so rather than assert or deny slowness.
  - id: checkout-logs-empty
    note: >-
      checkout's container log is empty, current and previous: the service
      exports its logs through OpenTelemetry, not stdout. "No errors in
      checkout's logs" is not evidence; the logs are unavailable.

restraint:
  note: >-
    The breakage visible in the cluster is ad and fraud-detection
    crash-looping, accounting being OOM-killed, and frontend's failed ad
    fetches. None explains checkout latency. The answer declines: no cause
    found for the slowness, with what was checked and what was not.
