# Drafted 2026-10-28 against the converted capture alone (k8s.json, ITBench's
# last pull, imported by k8stools 4.4.0; results/ re-recorded on 4.4.1's
# replay), before any run and before the wiki was built. ITBench's ground_truth.yaml was an input, not the
# answer: it says checkout "continues processing orders", and the capture
# says otherwise -- see the README. Times below are relative to captured_at
# (17:57:11Z); the revision is 434s old, so the change landed at ~17:49:57.
#
# The wiki is pinned here (capture.skill_digests.wiki), built by `k8srca
# scenario build-wiki` and re-read against these candidates and traps.
id: itbench-24-kafka-port-change
capture:
  captured_at: '2025-12-15T17:57:11+00:00'
  skill_digests:
    wiki: 9d25701ad730b32f        # built 2026-10-28; reviewed 2026-10-29

cause:
  summary: >-
    checkout's Deployment rolled to revision 2 about 7 minutes before capture
    (434s), and the only change from revision 1 is env KAFKA_ADDR, which the
    pod spec now sets to kafka:9999. The kafka Service exposes only 9092 and
    9093 (Kafka's listeners; accounting and fraud-detection use kafka:9092,
    and checkout's own wait-for-kafka init container checks kafka 9092 and
    passed). So every connection checkout's Kafka client makes to
    kafka:9999 (100.66.162.182, the kafka ClusterIP) ends in i/o timeout; after
    four 30-second attempts it logs ERROR "kafka: client has run out of
    available brokers to talk to", logs its service config with
    KafkaProducerClient:<nil>, and starts serving. About 1.5 minutes later
    (95s, then 85s), within a second of an order being charged, the instance
    exits with code 2 (216s and 206s after it started); the exit itself is not
    logged. Those two orders were charged although frontend-proxy answered
    their requests 500, so two customers paid and were told checkout failed. The revision-1 pod was deleted a second after the new container
    started (no readiness probe, so the new pod counted as ready at once and
    the rollout removed the working one), so there is nothing to fall back on: every
    POST /api/checkout in frontend-proxy's log since 17:50:02 has returned 500
    (259 of 259, about 35 a minute, against all 200s before), and the order
    path behind checkout (payment, shipping, quote) has gone quiet. At capture
    the second instance has just exited, the pod is in BackOff, the checkout
    Service has 0 ready endpoints, and the Deployment is Available=False.
    Kafka is healthy.
  must_identify: [checkout, KAFKA_ADDR, '9999']
  most_likely: bad-config
  # The pod spec and the log both name kafka:9999, the Service has no such
  # port, the revision changed only that variable, and the 500s begin five
  # seconds after it: strong. Moderate from an answer that holds back because
  # the exit itself carries no log line (see the gap).
  strength: [moderate, strong]

candidates:
  - id: bad-config
    standing: most_likely
    strength: [moderate, strong]
    note: >-
      Revision 2 changed only env KAFKA_ADDR; the pod spec shows kafka:9999;
      the log fails on kafka:9999 at the kafka ClusterIP; the Service and
      Kafka's listeners are 9092/9093. The onset is observed: frontend-proxy's
      last checkout 200 is at 17:49:59 and its first 500 at 17:50:02. The
      revision history shows the variable changed but not its old value; that
      it was kafka:9092 is an inference from the Service, the other Kafka
      clients and the init container, and an answer may state it.
  - id: kafka-broker-down
    standing: ruled_out
    note: >-
      kafka is 1/1 Running with 0 restarts on revision 1, 40 minutes old; its
      Service has 1 ready endpoint; its log is routine metadata-log
      housekeeping with no WARN or ERROR. checkout's init container reached
      kafka:9092 (nc -z) at 17:49:59 and completed at once.
  - id: network-partition-or-policy
    standing: ruled_out
    also_accept: [not_ruled_out]
    strength: [weak]
    note: >-
      An i/o timeout reads like a network fault, but the dial is to a port the
      kafka Service does not define, which times out rather than being
      refused, and the same pod reached kafka:9092 at start. NetworkPolicies
      are not recorded in this capture (the tools say so), so an answer that
      notes it could not check them, while placing the cause on the port, is
      also right.
  - id: application-crash
    standing: not_ruled_out
    also_accept: [ruled_out, most_likely]
    strength: [weak, moderate, strong]
    note: >-
      The process does exit on its own, code 2, reason Error, and the image is
      unchanged between revisions (2.1.3-checkout in both). What makes it exit
      is not recorded (see the gap). An answer that calls it a crash brought on
      by the bad Kafka address is right; one that blames the code or the image
      with no mention of KAFKA_ADDR is not (the cause item says so).
  - id: bad-command-or-args
    standing: ruled_out
    note: >-
      The tools gloss exit code 2 as "misuse of a shell builtin / invalid
      arguments", a shell convention. The revision changed no command or args,
      only an env var, and the log shows the program running its Kafka setup
      and starting to listen before it exits. Exit code 2 is what an
      unrecovered Go panic exits with (checkout is Go).
  - id: oom-kill
    standing: ruled_out
    note: Exit code 2, reason Error, not OOMKilled or 137. (No usage data is recorded.)
  - id: failed-liveness-probe
    standing: ruled_out
    note: No probe of any kind is configured on the container.
  - id: frontend-fault
    standing: ruled_out
    note: >-
      frontend and frontend-proxy are 1/1 on revisions 40 minutes old with no
      restarts. Only POST /api/checkout fails; every other route in
      frontend-proxy's log returns 200 (or 308) apart from the background
      503s below.

traps:
  - id: kafka-is-not-the-fault
    expect: avoided
    note: >-
      checkout's log names Kafka in every error line. Wrong: Kafka is down,
      unhealthy, overloaded or needs restarting, or a network fault cut
      checkout off from it. Right: Kafka is healthy and listening on 9092;
      checkout is pointed at a port nothing listens on.
  - id: checkout-is-not-serving
    expect: avoided
    note: >-
      ITBench's own ground truth asserts this, and the capture contradicts it.
      Wrong: checkout is healthy, is still processing orders, or only its
      Kafka publishing is affected. The Progressing condition reads
      "ReplicaSet checkout-849d65649b has successfully progressed", and that is
      not health either. Right: every checkout request through frontend-proxy
      since the change has returned 500, and at capture checkout has no ready
      endpoint.
  - id: load-generator-says-completed
    expect: avoided
    note: >-
      The load generator logs "Checkout completed for user ..." (or
      "Multi-item checkout completed") for each of the 259 checkouts
      frontend-proxy answered 500 -- its line means the request was made, not
      that it succeeded. Wrong: citing those lines as orders going through.
  - id: exit-2-is-not-a-shell-error
    expect: avoided
    note: >-
      Wrong: reading exit code 2 as a bad command, bad arguments or a shell
      error, from the tools' gloss. Nothing about the command changed; see the
      bad-command-or-args candidate.
  - id: background-503s
    expect: avoided
    note: >-
      frontend-proxy logs nine "503 UC" responses in the 14.5 minutes its
      captured log covers (on /api/products/*, /api/cart and
      /api/recommendations), eight of them before the change, among 10,000
      requests: a steady background trickle seen in every ITBench
      snapshot. None is on /api/checkout. Wrong: citing them as this
      incident's errors or its user impact, or as a second fault caused by
      it. Mentioning them as unrelated background is fine.
  - id: idle-consumers-are-a-consequence
    expect: avoided
    note: >-
      accounting's and fraud-detection's logs stop at 17:49:59, when the last
      order went through; both are 1/1 Running with 0 restarts. They are idle
      because no orders reach Kafka. Wrong: calling them failed, or a cause.
      Right: noting that downstream order processing receives nothing is fine.

gaps:
  - id: exit-reason-unrecorded
    note: >-
      The logs are the OTel records the service exported, not stdout/stderr,
      and the previous instance's log is not in the capture. checkout's last
      line, "starting to listen", comes 85s before its exit, and the exit
      carries none. What is observed: the service config line logs
      KafkaProducerClient:<nil>, and exit code 2 is what an unrecovered Go
      panic gives. Each exit falls within a second of one payment charge
      (17:53:35, 17:57:02), the only two since the change, which is
      consistent with the process dying while placing an order -- but no
      stack trace or message is here. An answer may offer a mechanism as
      likely, and may say the producer is logged as nil; one that states the
      exit's cause as observed (that it panicked, a fatal log call, a crash on
      startup) has gone beyond the capture.
  - id: who-changed-it
    note: >-
      The capture shows what changed and when, not who or what made the change:
      no change-cause annotation, and k8stools does not expose managedFields.
      (The raw object says the writer was an OpenAPI-generated client, not
      helm; the agent cannot see that.) An answer that names a person,
      pipeline or tool as the author has invented it.
