# Statements an answer is graded on (010 §7), written from truth.yaml and only
# from it: its cause, its candidates, its traps and its gaps. Not from runs.
# Drafted 2026-10-28; reviewed and frozen 2026-10-29 (004 §12.3 step 5).
id: itbench-24-kafka-port-change
items:
  # --- cause ---
  - id: cause-kafka-port
    expect: present
    group: cause
    diagnosis: true
    statement: checkout is failing because its KAFKA_ADDR points at kafka:9999, a port the kafka Service does not expose (Kafka listens on 9092).
    accept: ["KAFKA_ADDR is set to the wrong port", "KAFKA_ADDR=kafka:9999 but the kafka Service exposes only 9092/9093", "checkout points at port 9999 instead of 9092"]
  - id: cause-recent-revision
    expect: present
    group: cause
    statement: the setting came with a recent change to the checkout Deployment, a new revision about 7 minutes before.
    accept: ["revision 2 changed KAFKA_ADDR", "a rollout about 7 minutes ago"]
  - id: cause-checkout-down
    expect: present
    group: cause
    statement: checkout has no ready instance -- its container keeps exiting (code 2) and the previous pod was removed by the rollout -- so the checkout Service has no ready endpoint.
    accept: ["0 ready endpoints", "the old pod was deleted", "checkout is crash-looping and not ready", "Available=False"]
  - id: cause-no-readiness-probe
    expect: present
    group: cause
    statement: with no readiness probe, the new pod counted as ready at once, so the rollout removed the working revision-1 pod within a second and left nothing to fall back on.
    accept: ["no readiness probe, so the rollout deleted the old pod immediately", "the missing readiness probe let the bad revision replace the good one"]
  - id: impact-checkout-fails
    expect: present
    group: cause
    statement: users cannot place orders -- checkout requests through frontend-proxy have returned 500 since the change.
    accept: ["POST /api/checkout returns 500", "every checkout attempt fails", "orders are failing"]

  # --- ruled out ---
  - id: rules-out-kafka
    expect: present
    group: ruled_out
    statement: a Kafka failure is ruled out, because Kafka is running and ready with no restarts and serves the other clients on 9092.
    accept: ["Kafka is 1/1 with no restarts and no errors in its log", "Kafka is healthy and the init container reached it on 9092"]
  - id: rules-out-frontend
    expect: present
    group: ruled_out
    statement: a frontend or frontend-proxy fault is ruled out, because both are 1/1 with no restarts on unchanged revisions and only POST /api/checkout fails; their errors are checkout's 500s passed through.
    accept: ["frontend is fine; only checkout requests fail", "the proxy is passing on checkout's errors"]
  - id: rules-out-oom
    expect: present
    group: ruled_out
    statement: an OOM kill is ruled out, because the container exits with code 2, reason Error, not OOMKilled.

  # --- traps ---
  - id: no-kafka-blame
    expect: absent
    group: traps
    statement: Kafka is down, unhealthy or overloaded, or a network fault has cut checkout off from it.
    tempting: ["the Kafka broker is unreachable", "restart Kafka", "a network partition between checkout and kafka"]
    allowed: ["checkout cannot reach Kafka on port 9999", "NetworkPolicies are not recorded, so they could not be checked"]
  - id: no-checkout-serving
    expect: absent
    group: traps
    statement: checkout is healthy or still processing orders, or only its publishing to Kafka is affected.
    tempting: ["orders still complete but events are not published", "the load generator shows checkouts completing", "the rollout succeeded, so checkout is fine"]
    allowed: ["checkout was running for a few minutes between restarts", "the rollout completed and scaled the old ReplicaSet to 0, though the new pod is crash-looping", "two orders were charged although the user got a 500"]
  - id: no-shell-error
    expect: absent
    group: traps
    statement: the answer itself claims the container's command or arguments are wrong, or that exit code 2 is a shell error, as an explanation of the failure. A footnote that quotes the tool's termination fact ("exit 2 (misuse of a shell builtin / invalid arguments)") is the tools' gloss, not the answer's claim, and does not count.
    tempting: ["the exit code 2 shows the command or its arguments are invalid", "checkout exits because of a shell error"]
    allowed: ["a footnote quoting the termination fact with the tools' exit-code gloss", "the process exits with code 2", "the tools gloss exit 2 as a shell error, but the command did not change", "exit code 2 is consistent with an unrecovered Go panic"]
  - id: no-503s-as-impact
    expect: absent
    group: traps
    statement: frontend-proxy's 503 UC responses are part of this incident, its user impact, or a fault it caused.
    tempting: ["frontend-proxy is returning 503s because checkout is down"]
    allowed: ["a few 503s were already present before the change", "the 503s are unrelated background"]
  - id: no-consumer-fault
    expect: absent
    group: traps
    statement: accounting or fraud-detection has failed, or is part of the cause.
    tempting: ["accounting stopped logging, so it is broken too"]
    allowed: ["accounting and fraud-detection receive no orders", "downstream order processing is idle"]

  # --- gaps ---
  - id: no-observed-exit-mechanism
    expect: absent
    group: gaps
    statement: a specific in-process mechanism for checkout's exit -- a panic, a nil-pointer dereference, a log.Fatal or os.Exit call -- is stated as observed in the capture. Describing what the log shows in order (failing to reach Kafka, giving up, then the container exiting or crash-looping) is not a mechanism and does not count.
    tempting: ["the logs show it panics on a nil producer", "it calls log.Fatal when Kafka is unreachable"]
    allowed: ["its log shows it failing to reach the broker and giving up, and it has crash-looped since", "it exits after failing to reach Kafka", "it probably crashes when an order arrives without a Kafka producer", "the reason for the exit is not in the logs", "the service config logs KafkaProducerClient:<nil>", "exit code 2 is consistent with an unrecovered Go panic"]
  - id: no-named-author
    expect: absent
    group: gaps
    statement: a named person, pipeline or tool made the change. Offering one as the likely author counts, even when the answer adds that it cannot see who made it.
    tempting: ["a Helm upgrade changed KAFKA_ADDR", "the CI pipeline deployed it"]
    allowed: ["who made the change is not recorded"]

  # --- next steps ---
  - id: next-fix-kafka-addr
    expect: present
    group: next
    statement: a next step is to set KAFKA_ADDR back to kafka:9092, or to roll checkout back to the previous revision.
    accept: ["kubectl rollout undo deployment/checkout", "set KAFKA_ADDR=kafka:9092"]
