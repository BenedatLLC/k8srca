# Statements an answer is graded on (010 §7), written from truth.yaml and only
# from it: its cause, its candidates, its traps and its gaps. Not from runs.
# Frozen once 010 step 2 is done (docs/process.md §5).
id: checkout-gc-pressure
items:
  # --- cause ---
  - id: cause-checkout-near-limit
    expect: present
    group: cause
    statement: checkout's memory is at or near its 20Mi limit.
    accept: ["checkout uses 19Mi of its 20Mi limit", "checkout is at 97% of its memory limit"]
  - id: cause-gc-pressure
    expect: present
    group: cause
    statement: garbage-collection pressure in checkout is the likely cause, because its memory is above its GOMEMLIMIT of 16MiB.
    accept: ["the Go GC is running near continuously", "above the GC's soft limit", "GC thrashing"]
  - id: cause-cpu-contrast
    expect: present
    group: cause
    statement: checkout uses far more CPU than product-catalog, which has the same memory settings, or than its dependencies.
    accept: ["118m CPU against 7m for product-catalog", "checkout's CPU is high for its role"]
  - id: no-confirmed-cause
    expect: absent
    group: cause
    statement: GC pressure is confirmed as the cause, or stated with certainty.
    tempting: ["the cause is confirmed", "this is definitely GC thrashing"]
    allowed: ["GC pressure is likely", "the best-supported explanation"]

  # --- ruled out ---
  - id: no-downstream-ruled-out
    expect: absent
    group: ruled_out
    statement: a slow downstream dependency of checkout is ruled out.
    tempting: ["the dependencies are healthy, so not downstream latency"]
    allowed: ["its dependencies look healthy, which makes this less likely"]

  # --- traps ---
  - id: no-crash-loops-as-cause
    expect: absent
    group: traps
    statement: ad, fraud-detection or accounting failing causes or contributes to checkout's slowness.
    allowed: ["ad and fraud-detection are crash-looping, but they are not on checkout's path"]
  - id: no-postgres-errors-as-cause
    expect: absent
    group: traps
    statement: postgresql's duplicate key errors are tied to checkout or to its slowness.
    allowed: ["the duplicate key errors come from accounting's writes"]
  - id: no-kafka-backpressure
    expect: absent
    group: traps
    statement: checkout is slowed by a kafka backlog or by back-pressure from failing consumers.
    allowed: ["checkout publishes to kafka; a consumer being down does not slow it"]
  - id: no-frontend-errors-as-checkout
    expect: absent
    group: traps
    statement: frontend's UNAVAILABLE / ECONNREFUSED errors are failed calls to checkout or payment, or evidence about checkout's latency.
    allowed: ["frontend's connection errors are calls to ad"]
  - id: no-near-limit-others-as-causes
    expect: absent
    group: traps
    statement: other services near their memory limit, such as payment or product-catalog, are also slow or are causes, on memory alone.
    allowed: ["several services sit near their limits, but only checkout also shows high CPU"]

  # --- gaps ---
  - id: says-no-latency-data
    expect: present
    group: gaps
    statement: there is no latency data, so the slowness and its cause cannot be confirmed here.
    accept: ["no metrics or traces to measure latency", "I could not measure request latency"]
  - id: no-clean-logs-evidence
    expect: absent
    group: gaps
    statement: checkout's logs showing no errors is offered as evidence.
    tempting: ["checkout's logs are clean", "no errors in checkout's logs"]
    allowed: ["checkout's logs are empty: it exports logs through OpenTelemetry"]

  # --- next steps ---
  - id: next-confirm-gc
    expect: present
    group: next
    statement: a next step that would confirm or refute GC pressure, such as raising checkout's memory limit and GOMEMLIMIT and comparing, or measuring its latency or GC activity.
    accept: ["raise the limit to 64Mi and see if latency drops", "check GC metrics or traces for checkout"]
