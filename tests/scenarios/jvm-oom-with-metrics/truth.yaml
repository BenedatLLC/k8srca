# Written 2026-10-19 against the capture, the metrics capture and the wiki
# pinned beside them, and only those. Re-recorded 2026-10-30 under issue #3,
# with a full 7-day window of 15s metrics (667 series, 25.9M samples), and
# re-reviewed against that recording: every count, offset, window and age
# below was read again from it. The metrics were read through promtools on the
# replay of the new block, as the agent reads them (memory_report,
# restart_report, query). Re-recording moves every count and offset below
# (004 §6.3).
id: jvm-oom-with-metrics
capture:
  captured_at: '2026-10-30T04:07:34+00:00'
  skill_digests:
    wiki: 4df3e920e4cba77d
  metrics:
    end: '2026-10-30T04:07:34+00:00'
    digest: 8b9f59977eb23dbc

cause:
  # Per-hour figures are restart_report's: 168 whole hours counted back from
  # the report's end, each an increase() over its hour, so they carry
  # extrapolation decimals (8.0 to 15.1). As whole restarts: 8 to 15.
  summary: >-
    The ad container's memory limit equals its request (300Mi), and the JVM
    runs with no heap sizing: JAVA_TOOL_OPTIONS adds only the OpenTelemetry
    javaagent. The memory series shows the pod's working set reach its 300Mi
    limit from the start of every life it can shape, flat until the kill. Every termination
    in the window is OOMKilled with exit 137, and the container has restarted
    9707 times, 1754 of them in the 7 days of metrics. It loops whatever the
    time of day, 8 to 15 restarts in every hour of the window. The loop began
    before both the events (about 20 days) and the metrics (7 days) retain.
  must_identify: [ad, memory, 300Mi]
  most_likely: memory-limit-too-low
  # Strong only. What made moderate right for jvm -- the reason read Error, and
  # no memory figure existed -- is gone: the reason says OOMKilled throughout
  # and the memory series shows the limit reached in every life. An answer that
  # holds this at moderate is under what the evidence gives, the 009 §1 case.
  strength: [strong]

candidates:
  # --- CrashLoopBackOff ---
  - id: application-crash
    standing: ruled_out
    note: >-
      Exit 137, reason OOMKilled, on every termination the reason series
      retains, across all 7 days. The container is in back-off with no running
      instance at capture, so the only log is the last terminated instance's
      (previous and current return the same lines). It ends with the SLF4J
      warnings two seconds after "Ad service starting", and that instance was
      killed at 46s. There is no exception and no stack trace.
  - id: bad-config
    standing: not_ruled_out
    also_accept: [ruled_out]
    strength: [weak]
    note: >-
      Nothing in the logs names a missing or invalid setting, and ad references
      no ConfigMap or Secret. As in jvm, ad reads feature flags from flagd, and
      a flag toggle leaves no trace here, so not ruled out, weak, is right.
      Ruled out is accepted too: with the memory series showing the limit
      reached in every life, an answer that rules a configuration fault out as
      the cause has a reason the capture supports.
  - id: failed-liveness-probe
    standing: ruled_out
    note: No probe of any kind is configured on the container.
  - id: oom
    standing: most_likely
    strength: [strong]
    note: >-
      Exit 137, reason OOMKilled throughout the reason series, and the working
      set at the limit in every life. The survivor, which obliges the answer to
      say which kind of OOM.

  # --- OOMKilled ---
  - id: memory-limit-too-low
    standing: most_likely
    strength: [strong]
    note: >-
      Limit equals request at 300Mi with no heap flags. Of the 1142 lives with
      two or more samples, 977 are at the limit in their first sample (median
      first sample 0.995 of the limit) and the other 165 reach it within 32s
      of starting. None stays below it, and the sampled peak reaches the limit
      on each of the 7 days. The process's startup footprint is at least the
      limit. fraud-detection, the only other container with a 300Mi limit and
      the same JVM setup, is dying the same way.
  - id: memory-leak
    standing: ruled_out
    note: >-
      Ruled out on data. A leak needs memory that climbs within a life. Here
      the working set starts at the limit, or reaches it within 32 seconds of
      the start, which is startup and not accumulation. It then stays flat
      until the kill, including in the lives that last minutes (up to 11.4).
      Not ruled out on "no memory series" is wrong here: there is one.
  - id: workload-spike
    standing: ruled_out
    also_accept: [not_ruled_out]
    strength: [weak]
    note: >-
      Kills come at 8 to 15 an hour in every one of the window's 168 hours,
      with no hour free of them, 242 to 257 a day, and every life reaches the
      limit at or just after its start. A spike would show kills clustering
      with load. Ruled out is right. The metrics capture holds no request rate
      (see `no-request-rate`), so not ruled out, weak, on that ground is also
      accepted.

traps:
  # jvm's `reason-says-error` does not carry over. Here the container state
  # and every sample of ad's reason series say OOMKilled, so there is no
  # disagreement to flag. Nor does `previous-log-is-a-kubelet-error`: the
  # previous instance's log is present.
  - id: pod-oom-counter-is-not-evidence
    expect: avoided
    note: >-
      container_oom_events_total reads 0 for the ad and fraud-detection pods
      through 1754 and 1950 OOM kills in the window. The series is the pod's
      cgroup, and it does not count kills of the containers inside it;
      promtools says so with the result. Wrong: reading the zero as evidence
      against OOM, or as a contradiction to resolve. Right: ignoring it, or
      saying it does not count container kills.
  - id: restart-cadence-is-not-lifetime
    expect: avoided
    note: >-
      ad restarts 8 to 15 times an hour, every 4 to 7.5 minutes, set by the
      kubelet's back-off. How long each life runs is another quantity: the
      last one ran 46s, and at capture the container is waiting in back-off,
      1m47s so far, with no running instance. The running series shows lives
      from 2s to 11.4 minutes, median 41s, and 184 of the window's 1754 lives
      fall between two samples. Wrong: stating the restart interval as
      seconds, or a lifetime as the interval.
  - id: retained-window-is-not-onset
    expect: avoided
    note: >-
      Two windows, and neither is the onset. The events start about 20 days
      before capture, when the cluster last started. The metrics start 7 days
      before, at the capture's window (the live retention is 2w). The restart
      counter already reads 7953 at the first sample, and promtools reports
      the onset as not in the window. Wrong: dating the loop's start to either
      edge, or to the deployment. Right: looping throughout what is retained,
      and before it.
  - id: shared-limit-is-a-common-cause-not-a-dependency
    expect: avoided
    note: >-
      fraud-detection is crash-looping too: 10934 restarts, 1950 of them in
      the window at 11 to 12 an hour, 2s lives, in back-off at capture, with
      the same 300Mi limit == request shape. Saying the two share a cause, an
      under-sized limit for this JVM setup, is right. Claiming a dependency,
      that one fails because the other is down, is wrong.
  - id: accounting-is-a-different-severity-not-a-third-crash-loop
    expect: avoided
    note: >-
      accounting is killed for memory too: 1678 restarts, 310 in the window,
      OOMKilled, on a 120Mi limit, and its pod's sampled working set goes above
      that limit (140.2 MiB). But its last life ran about 20 minutes (1181s),
      its lives run from about 5 minutes to over 3 hours (median 19.7m), it
      restarts 0 to 4 times an hour with 37 of the 168 hours free of restarts,
      and it is ready and serving between kills with no back-off.
      load-generator's last termination was an OOM kill too, about 18 days ago
      after nearly two days of running, and it has not restarted since,
      though its last-reason series reads OOMKilled through the whole window.
      "Several services here are memory-starved" is right. Calling accounting
      a third crash loop, or putting either one in the same failure as ad and
      fraud-detection, is wrong.

gaps:
  - id: no-request-rate
    expect: reported_unavailable
    note: >-
      The metrics capture holds memory, CPU, restarts and termination reasons,
      not request rate or traffic. An answer that states a request rate or a
      load figure has invented it. One that says load cannot be measured here
      is correct.

