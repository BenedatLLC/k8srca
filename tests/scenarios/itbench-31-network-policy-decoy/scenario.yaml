# Imported from ITBench-Lite SRE Scenario-31 (design 004 §12.3). Vehicle: a
# NetworkPolicy, frontend-block-all-ports, whose one empty ingress rule allows
# all ingress, so it blocks nothing. Discriminates: restraint with a decoy --
# a policy named "block-all", created six minutes before the alert, on the
# alerting proxy's upstream, that the tools show had no effect.
id: itbench-31-network-policy-decoy
question: |
  RequestErrorRate is firing for frontend-proxy in the otel-demo namespace.
  What's going on, and what's the user impact?
sources:
  k8stools:
    state: k8s.json
    digest: 3f1fa90c6c087862
    clock: frozen
budget:
  # Not yet measured; itbench-33's.
  max_tool_calls: 50
  max_usd: 0.70

architecture:
  namespaces: [otel-demo]
  sources:
    - type: live_cluster
    - type: change_history

# Results the facts layer derives from that the triage reads don't include
# (012 step 2): the policy's own report and the reads of the proxy's log.
record_calls:
  - tool: get_workload_report
    arguments: {namespace: otel-demo, name: frontend}
  - tool: get_networkpolicy_summaries
    arguments: {namespace: otel-demo}
  - tool: get_log_pattern_summary
    arguments: {namespace: otel-demo, pod_name: frontend-proxy-6b4d584985-p6mgt, pattern: " 503 UC "}
  - tool: get_logs_for_pod_and_container
    arguments: {namespace: otel-demo, pod_name: frontend-proxy-6b4d584985-p6mgt, tail: 100}
