# Mined: Containers that restart or are killed (design 007 §8).
#
#
# Sources (each item's `sources` quotes the passage it rests on):
#   k8s-debug-pods: Kubernetes documentation, "Debug Pods", https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
#     CC-BY-4.0, retrieved 2026-10-16
#   k8s-pod-failure-reason: Kubernetes documentation, "Determine the Reason for Pod Failure", https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/
#     CC-BY-4.0, retrieved 2026-10-16
#   k8s-debug-init-containers: Kubernetes documentation, "Debug Init Containers", https://kubernetes.io/docs/tasks/debug/debug-application/debug-init-containers/
#     CC-BY-4.0, retrieved 2026-10-16
#   prom-kube-pod-crash-looping: kube-prometheus runbooks, "KubePodCrashLooping", https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodcrashlooping/
#     Apache-2.0, retrieved 2026-10-16
#   aks-pod-restarts: Microsoft Learn, "Troubleshoot pod workload restarts in AKS", https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/availability-performance/troubleshoot-pod-workload-restart
#     CC-BY-4.0, retrieved 2026-10-16
#   aks-oomkilled: Microsoft Learn, "Troubleshoot OOMKilled in AKS clusters", https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/availability-performance/troubleshoot-oomkilled-aks-clusters
#     CC-BY-4.0, retrieved 2026-10-16
#   gke-crashloopbackoff: Google Kubernetes Engine documentation, "Troubleshoot CrashLoopBackOff events", https://cloud.google.com/kubernetes-engine/docs/troubleshooting/crashloopbackoff-events
#     CC-BY-4.0, retrieved 2026-10-16
#   k8sgpt-pod-analyzer: k8sgpt, "k8sgpt pod analyzer", https://github.com/k8sgpt-ai/k8sgpt/blob/main/pkg/analyzer/pod.go
#     Apache-2.0, retrieved 2026-10-16
#   robusta-restart-loop: Robusta, "Robusta restart loop reporter", https://github.com/robusta-dev/robusta/blob/master/playbooks/robusta_playbooks/restart_loop_reporter.py
#     MIT, retrieved 2026-10-16
#   robusta-oom-killer: Robusta, "Robusta OOM killer enrichment", https://github.com/robusta-dev/robusta/blob/master/playbooks/robusta_playbooks/oom_killer.py
#     MIT, retrieved 2026-10-16
#   robusta-pod-investigator: Robusta, "Robusta pod investigator", https://github.com/robusta-dev/robusta/blob/master/playbooks/robusta_playbooks/pod_investigator_enricher.py
#     MIT, retrieved 2026-10-16
#   vendored-kb: vendored, "k8srca's vendored knowledge base", vendor/kb/kubernetes_rca_knowledge_base_v2.json
#     as received (vendor/kb/README.md), retrieved as vendored
#
#
# Reviewed 2026-10-16 (007 §8.3). Changes from the draft:
#
# * Refutes that rested on silence in the logs ("not <error> in the logs") now
#   need a positive observation: the logs name a different cause
#   (logs_show_different_fatal_error, added), or the container completed
#   startup. Logs truncate and rotate; absence there is not evidence.
# * The kinds of OOM: dropped `container-reached-its-limit`, which restated what
#   a cgroup OOM is. oom-kill refines into the authored three plus node memory
#   pressure (with no-memory-limit-set under it), cache growth, and a probe
#   heavy enough to cause the kill.
# * Nested specific causes under general ones, so `lookup pod-restarting`
#   offers 13 candidates, not 22: spec and security-context faults under
#   bad-config, auth and timeout under the dependency claim, mutable tags under
#   application-release, eviction under pod-replaced.
# * Dropped a symptom no alert mapped to, a KubePodCrashLooping mapping the
#   authored layer already makes, and exclusions nesting stopped being
#   between siblings. Fixed two conditions that did not parse.
# * Converted the two hypotheses no claim cited: PodRestartSpike "probes" ->
#   failed-liveness-probe, MemoryWorkingSetGrowing "workload growth" ->
#   workload-spike.

#
# Revised 2026-10-16 after the first jvm gate (007 §11.2):
#
# * Timing (007 §3.4): claims that blamed a change now need an observed onset
#   and use the shared changed_before_onset[X, Kind]. Dropped the facts that
#   said it ad hoc (deployment_change_precedes_restart_spike,
#   restart_count_rose_sharply, node_disruption_near_restarts) and the
#   supports that cited a change with no onset; added the `node` change kind.
# * Dropped read-deployment-change, a duplicate of the authored
#   read-rollout-history whose limits line answers echoed as an observation
#   ("only revision 2 is retained").
symptoms:
  pod-restarting:
    title: Container repeatedly restarts
    claims:
    - work-completed-exit-zero
    - failing-init-container
    - dependency-unavailable-at-startup
    - startup-resource-starvation
    - run-container-error
    - lifecycle-hook-failure
    - pod-replaced
    - application-release
    - node-issue
    sources:
    - source: k8s-pod-failure-reason
      quote: This page shows how to write and read a Container termination message.
    - source: k8s-debug-init-containers
      quote: '`Init:CrashLoopBackOff` | An Init Container has failed repeatedly.'
    - source: prom-kube-pod-crash-looping
      quote: 'Pod is in CrashLoop which means the app dies or is unresponsive and '
    - source: aks-pod-restarts
      quote: Pod workloads in an AKS cluster restart repeatedly.
    - source: gke-crashloopbackoff
      quote: If your Pods in Google Kubernetes Engine (GKE) are stuck in a CrashLoopBackOff
        state, it means that one or more containers are repeatedly starting and then exiting.
    - source: k8sgpt-pod-analyzer
      quote: // This represents container that is in CrashLoopBackOff state due to conditions
        such as OOMKilled
    - source: robusta-restart-loop
      quote: When a pod is in restart loop, debug the issue, fetch the logs, and send useful
        information on the restart
    - source: vendored-kb
      quote: 'PodRestartSpike reports: Restart count suddenly increases (resource: Pod)'
  container-oom-killed:
    title: Container terminated for memory
    claims: &id002
    - node-memory-pressure
    - cache-growth
    - heavy-probe-resource-use
    sources:
    - source: aks-oomkilled
      quote: User pods might be OOMKilled due to insufficient memory limits or excessive memory
        consumption.
    - source: gke-crashloopbackoff
      quote: In rare cases, the liveness probe's execution itself might consume significant
        resources, which could trigger resource constraints that potentially lead to the container
        being terminated due to an OOM kill.
    - source: robusta-oom-killer
      quote: '    Retrieves pod and node information for an OOMKilled pod'
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing reports: Memory steadily increases (resource: Container)'
  startup-probe-failing:
    title: Container is killed by its startup check before it comes up
    claims:
    - slow-startup
    - startup-failure
    - bad-startup-probe
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed reports: Container fails startup check (resource: Container)'
alerts:
  PodOOMKilled:
    symptom: container-oom-killed
    sources:
    - source: robusta-oom-killer
      quote: '        aggregation_key="PodOOMKilled",'
  LivenessProbeFailed:
    symptom: pod-restarting
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed reports: Kubelet restarts unhealthy container (resource:
        Container)'
  StartupProbeFailed:
    symptom: startup-probe-failing
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed reports: Container fails startup check (resource: Container)'
  PodRestartSpike:
    symptom: pod-restarting
    sources:
    - source: vendored-kb
      quote: 'PodRestartSpike reports: Restart count suddenly increases (resource: Pod)'
  MemoryWorkingSetGrowing:
    symptom: container-oom-killed
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing reports: Memory steadily increases (resource: Container)'
facts:
  spec_validation_reports_unknown_field:
    params:
    - W
    says: validating the submitted manifest for the workload reports an unknown field
    sources:
    - source: k8s-debug-pods
      quote: 'If you misspelled `command` as `commnd` then will give an error like this:'
  applied_spec_differs_from_intent:
    params:
    - P
    says: the stored object for the pod is missing lines that were present in the submitted
      description
    sources:
    - source: k8s-debug-pods
      quote: However, if there are lines on the original that are not on the apiserver version,
        then this may indicate a problem with your pod spec.
  command_absent_from_applied_spec:
    params:
    - C
    says: the applied pod spec carries no command line for the container, so it runs the image's
      default
    sources:
    - source: k8s-debug-pods
      quote: For example, if you misspelled `command` as `commnd` then the pod will be created
        but will not use the command line you intended it to use.
  termination_message_recorded:
    params:
    - C
    says: the container's last termination recorded a termination message in its container
      status
    functional: true
    sources:
    - source: k8s-pod-failure-reason
      quote: Kubernetes use the contents from the specified file to populate the Container's
        status message on both success and failure.
  termination_message_names_fatal_event:
    params:
    - C
    says: the termination message of the container describes a fatal event, such as an assertion
      failure
    functional: true
    sources:
    - source: k8s-pod-failure-reason
      quote: The termination message is intended to be brief final status, such as an assertion
        failure message.
  terminated_container_identified:
    params:
    - P
    - C
    says: in the pod, the container is the one whose termination message records the failure
    sources:
    - source: k8s-pod-failure-reason
      quote: 'If you are running a multi-container Pod, you can use a Go template to include
        the container''s name. By doing so, you can discover which of the containers is failing:'
  termination_message_policy_fallback_to_logs:
    params:
    - C
    says: the container's terminationMessagePolicy is FallbackToLogsOnError, so the last chunk
      of container log stands in when the termination message file is empty
    functional: true
    sources:
    - source: k8s-pod-failure-reason
      quote: By setting the `terminationMessagePolicy` to "`FallbackToLogsOnError`", you can
        tell Kubernetes to use the last chunk of container log output if the termination message
        file is empty and the container exited with an error.
  init_containers_completed_count:
    params:
    - P
    - Done
    - Total
    says: '{Done} of the pod''s {Total} init containers have completed so far'
    functional: true
    sources:
    - source: k8s-debug-init-containers
      quote: '`Init:N/M` | The Pod has `M` Init Containers, and `N` have completed so far.'
  init_containers_finished:
    params:
    - P
    says: the pod has already finished executing its init containers
    sources:
    - source: k8s-debug-init-containers
      quote: '`PodInitializing` or `Running` | The Pod has already finished executing Init
        Containers.'
  init_container_crashloopbackoff:
    params:
    - C
    says: the init container is waiting in CrashLoopBackOff after failing repeatedly
    sources:
    - source: k8s-debug-init-containers
      quote: '`Init:CrashLoopBackOff` | An Init Container has failed repeatedly.'
  init_container_failed_to_execute:
    params:
    - C
    says: the init container failed to execute and terminated with reason Error
    sources:
    - source: k8s-debug-init-containers
      quote: '`Init:Error` | An Init Container has failed to execute.'
  failing_container_is_init:
    params:
    - C
    says: the failing container is one of the pod's init containers rather than an app container
    sources:
    - source: robusta-restart-loop
      quote: all_statuses = status.containerStatuses + status.initContainerStatuses
    - source: robusta-pod-investigator
      quote: all_statuses = pod.status.containerStatuses + pod.status.initContainerStatuses
  waiting_reason:
    params:
    - C
    - Reason
    says: the container is waiting to start with reason {Reason}
    functional: true
    sources:
    - source: k8sgpt-pod-analyzer
      quote: '"CrashLoopBackOff", "ImagePullBackOff", "CreateContainerConfigError", "PreCreateHookError",
        "CreateContainerError",'
    - source: robusta-restart-loop
      quote: and (config.restart_reason is None or config.restart_reason in container_status.state.waiting.reason)
    - source: robusta-pod-investigator
      quote: and "CrashLoopBackOff" in container_status.state.waiting.reason
  waiting_message_names_cause:
    params:
    - C
    says: the waiting-state message on the container states why the container could not be
      created or started
    sources:
    - source: k8sgpt-pod-analyzer
      quote: '} else if isErrorReason(containerStatus.State.Waiting.Reason) && containerStatus.State.Waiting.Message
        != "" {'
  last_termination_reason:
    params:
    - C
    - Reason
    says: the reason recorded for the container's last termination is {Reason}
    functional: true
    sources:
    - source: aks-oomkilled
      quote: 'Common indicators include **exit code 137** and the reason **OOMKilled**

        in `kubectl describe pod`.'
    - source: k8sgpt-pod-analyzer
      quote: // This represents container that is in CrashLoopBackOff state due to conditions
        such as OOMKilled
    - source: gke-crashloopbackoff
      quote: 'A CrashLoopBackOff event is often caused by an Out of Memory (OOM) issue. You
        can confirm if this is the cause if the kubectl describe output shows the following:'
    - source: aks-pod-restarts
      quote: Under **Containers** (or **Init Containers**), check **State**, **Last State**,
        **Reason**, **Exit Code**, and **Restart Count**.
    - source: vendored-kb
      quote: 'PodRestartSpike supporting evidence: restart counter; deployment change; termination
        reason; node events'
    - source: robusta-pod-investigator
      quote: and container_status.lastState.terminated.reason == "Error"
  pod_status_reason_evicted:
    params:
    - P
    says: the pod reports status Failed with reason Evicted
    sources:
    - source: k8sgpt-pod-analyzer
      quote: if pod.Status.Reason == "Evicted" {
    - source: aks-oomkilled
      quote: Evicted pods show a status of **Failed** and a reason of **Evicted**.
  eviction_message_states_reason:
    params:
    - P
    says: the status message on the pod states why it was evicted
    sources:
    - source: k8sgpt-pod-analyzer
      quote: if pod.Status.Message != "" {
  restart_count_increasing:
    params:
    - C
    says: the restart count of the container keeps increasing over time
    sources:
    - source: aks-pod-restarts
      quote: The pod `RESTARTS` count continues to increase over time.
  restart_count_above_one:
    params:
    - C
    says: the container has restarted more than once
    sources:
    - source: robusta-restart-loop
      quote: 'and container_status.restartCount > 1  # report only after the 2nd restart and
        get previous logs'
    - source: robusta-pod-investigator
      quote: and container_status.restartCount > 1
  not_all_replicas_affected:
    params:
    - W
    says: some replicas of the workload are available while others are not ready for the same
      reason
    sources:
    - source: robusta-pod-investigator
      quote: message_text = f"{available_replicas} pod(s) are available. {unavailable_replicas}
        pod(s) are not ready due to {issue_text}"
  pod_age_reset_at_incident:
    params:
    - P
    says: the pod's age reset around the time of the incident
    sources:
    - source: aks-pod-restarts
      quote: '- **AGE reset around the incident and the original pod is gone** - Investigate
        pod replacement.'
  original_pod_gone:
    params:
    - P
    says: the pod that was running before the incident no longer exists
    sources:
    - source: aks-pod-restarts
      quote: '- **AGE reset around the incident and the original pod is gone** - Investigate
        pod replacement.'
  audit_shows_pod_delete_or_evict:
    params:
    - P
    says: audit records show a deletion, creation, eviction or workload update for the pod
      around the incident time
    sources:
    - source: aks-pod-restarts
      quote: Review Kubernetes audit logs for the namespace and incident time to identify
        pod deletion, creation, eviction, or workload updates, including the operation, timestamp,
        and initiating user or controller.
  restart_policy:
    params:
    - P
    - Policy
    says: the restart policy of the pod is {Policy}
    functional: true
    sources:
    - source: aks-pod-restarts
      quote: '| `Completed` or exit `0`, followed by another start | Check restart policy.
        For a short-lived process under `Always`, consider a job instead of a service. |'
  logs_show_dependency_wait:
    params:
    - C
    says: the logs of the container show the process waiting for or failing to reach another
      service it needs at startup
    sources:
    - source: prom-kube-pod-crash-looping
      quote: app waits for other services to start, such as database
  dependency_endpoints_not_ready:
    params:
    - S
    says: the service container depends on has no ready backends
    sources:
    - source: prom-kube-pod-crash-looping
      quote: app waits for other services to start, such as database
  cpu_limit_reached_during_startup:
    params:
    - C
    says: the container sits at its CPU limit or memory ceiling during the startup window
      of each life
    sources:
    - source: prom-kube-pod-crash-looping
      quote: not enough CPU which is required on start
  probe_target_not_served:
    params:
    - C
    says: the probe of the container targets a port, path, command or handler type that the
      container does not serve or provide
    sources:
    - source: prom-kube-pod-crash-looping
      quote: readiness and liveness probes may be incorrect - wrong port or command,
    - source: gke-crashloopbackoff
      quote: 'Port: verify that the port configured in the probe is actually used and exposed
        by the app.'
    - source: gke-crashloopbackoff
      quote: 'Verify probe type: your probe''s configuration must match how your app reports
        its health.'
    - source: gke-crashloopbackoff
      quote: 'Command (for exec probe type): make sure the command exists within the container,
        returns an exit code of 0 for success, and completes within the configured timeoutSeconds
        period.'
  probe_thresholds_tighter_than_app_needs:
    params:
    - C
    says: the probe's timeout, period, failure threshold or initial delay for the container
      is tighter than the time the application needs to start or to answer
    sources:
    - source: prom-kube-pod-crash-looping
      quote: check is failing too fast due to short timeout for response
    - source: aks-pod-restarts
      quote: Liveness or startup probes are misconfigured so that the probe timeout, failure
        threshold, or initial delay doesn't account for normal application startup or response
        time.
    - source: gke-crashloopbackoff
      quote: 'Timeout: make sure that the timeoutSeconds value is sufficient for the app to
        respond, especially during startup or under load.'
    - source: gke-crashloopbackoff
      quote: 'Initial delay (initialDelaySeconds): check if the initial delay is sufficient
        for the app to start before probes begin.'
    - source: vendored-kb
      quote: 'LivenessProbeFailed candidate cause: probe too aggressive'
  referenced_configmap_or_secret_missing:
    params:
    - W
    says: a ConfigMap or Secret referenced by the workload does not exist in the namespace
    sources:
    - source: prom-kube-pod-crash-looping
      quote: missing files such as configmaps/secrets/volumes
  mount_failure_event:
    params:
    - P
    says: events for the pod report a failed mount of a ConfigMap, Secret or volume
    sources:
    - source: prom-kube-pod-crash-looping
      quote: missing files such as configmaps/secrets/volumes
  missing_file_error_in_logs:
    params:
    - C
    says: the logs of the container name a file or path that does not exist
    sources:
    - source: prom-kube-pod-crash-looping
      quote: missing files such as configmaps/secrets/volumes
  readonly_filesystem_error_in_logs:
    params:
    - C
    says: the logs of the container report a write failing on a read-only filesystem
    sources:
    - source: prom-kube-pod-crash-looping
      quote: read only filesystem
  readonly_root_filesystem_set:
    params:
    - C
    says: the container is configured with a read-only root filesystem
    sources:
    - source: prom-kube-pod-crash-looping
      quote: read only filesystem
  permission_denied_error_in_logs:
    params:
    - C
    says: the logs of the container report permission denied on a file, directory or socket
    sources:
    - source: prom-kube-pod-crash-looping
      quote: wrong user permissions in container
    - source: gke-crashloopbackoff
      quote: 'Permissions issues: the app could lack the necessary permissions to read or
        write the configuration file.'
  security_context_user_override:
    params:
    - C
    says: the security context of the container runs the process as a user other than the
      image's default
    sources:
    - source: prom-kube-pod-crash-looping
      quote: wrong user permissions in container
  operation_not_permitted_in_logs:
    params:
    - C
    says: the logs of the container report an operation not permitted that needs a privileged
      kernel capability
    sources:
    - source: prom-kube-pod-crash-looping
      quote: lack of special container capabilities (securityContext)
  capabilities_restricted:
    params:
    - C
    says: the security context of the container drops capabilities or adds none that the process
      needs
    sources:
    - source: prom-kube-pod-crash-looping
      quote: lack of special container capabilities (securityContext)
  working_dir_not_set_in_spec:
    params:
    - C
    says: the pod spec sets no workingDir for the container, so relative paths resolve from
      whatever directory the runtime chooses
    sources:
    - source: prom-kube-pod-crash-looping
      quote: app is executed in different directory than expected
  probe_failure_events_present:
    params:
    - C
    says: events for the container record liveness or startup probe failures
    sources:
    - source: aks-pod-restarts
      quote: Events from `kubectl describe pod <pod-name>` show `liveness/startup` probe failures.
    - source: vendored-kb
      quote: 'StartupProbeFailed metric evidence: probe failure events'
  killing_event_follows_probe_failure:
    params:
    - C
    says: a Killing event for the container follows the probe-failure event for the same container
    sources:
    - source: aks-pod-restarts
      quote: Look for a matching `Liveness probe failed` event followed by a `Killing` event
        for the same container before attributing the restart to liveness.
  startup_probe_configured:
    params:
    - C
    says: a startup probe is configured on the container
    sources:
    - source: aks-pod-restarts
      quote: Configure startup probes for applications that require extra initialization time.
    - source: vendored-kb
      quote: 'StartupProbeFailed reports: Container fails startup check (resource: Container)'
  probe_checks_external_dependency:
    params:
    - C
    says: the probe endpoint of the container validates external resources such as a database,
      storage mount or downstream service instead of only the process itself
    sources:
    - source: aks-pod-restarts
      quote: Probe endpoints depend on external resources, such as databases, storage mounts,
        and downstream services.
    - source: aks-pod-restarts
      quote: Therefore, liveness probes perform full application or dependency validation
        instead of basic process health checks.
  container_cpu_saturated_during_probes:
    params:
    - C
    says: the container is CPU-throttled or at high CPU utilization during the probe intervals
    sources:
    - source: aks-pod-restarts
      quote: CPU throttling or resource contention causes probe requests to time out.
    - source: gke-crashloopbackoff
      quote: High CPU usage on the container or the node can prevent the app from responding
        to the probe in time.
  node_cpu_saturated:
    params:
    - N
    says: cPU utilization on the node is high during the probe intervals
    sources:
    - source: gke-crashloopbackoff
      quote: 'Analyze CPU usage: monitor the CPU utilization of the affected container and
        the node it''s running on during the probe intervals.'
  node_disk_io_slow:
    params:
    - N
    says: the node spends a long time on disk operations, slowing container startup and app
      initialization
    sources:
    - source: gke-crashloopbackoff
      quote: High disk I/O can significantly slow down container startup, app initialization,
        or overall app performance, leading to probe timeouts.
  logs_show_initialization_failure:
    params:
    - C
    says: the previous instance's log entries for the container indicate abrupt termination
      or an initialization failure
    sources:
    - source: aks-pod-restarts
      quote: Application log entries indicate abrupt termination or initialization failures.
  memory_limit_set:
    params:
    - C
    says: a memory limit is set on the container
    sources:
    - source: aks-oomkilled
      quote: '**Resource overcommitment**: You don''t set pod resource requests and limits
        appropriately, which leads to excessive memory usage.'
    - source: robusta-oom-killer
      quote: '            memory_limit = "No limit" if not limits else f"{limits}MB limit"'
  container_memory_near_limit:
    params:
    - C
    says: the container's memory use reaches almost all of its specified memory limit
    sources:
    - source: aks-oomkilled
      quote: 'This helps to confirm whether the pod is approaching or exceeding its

        memory limits.'
    - source: robusta-oom-killer
      quote: '        reason = f"container used too much memory: reached {used_memory_percentage}
        percentage of its specified limit"'
  node_memory_near_capacity:
    params:
    - N
    says: the node's memory use reaches almost all of the memory available on it, leaving
      too little for the pods running there
    sources:
    - source: aks-oomkilled
      quote: '**Insufficient node resources**: The node doesn''t have enough memory to support
        the running pods, which leads to OOM kills.'
    - source: robusta-oom-killer
      quote: '        reason = f"node {node_name} used too much memory: reached {node_max_used_memory_in_percentage}
        percentage of its available memory"'
  node_allocated_memory_percent:
    params:
    - N
    - Percent
    says: '{Percent} of the node''s allocatable memory is already taken by pod requests'
    functional: true
    sources:
    - source: robusta-oom-killer
      quote: '                f"{allocated_precent:.2f}% out of {allocatable_memory}MB allocatable",'
  other_pods_oom_killed_on_node:
    params:
    - N
    says: other pods on the node were killed by the OOM killer around the same time
    sources:
    - source: robusta-oom-killer
      quote: '    Add the list of pods on this node that we''re killed by the OOM killer.'
  kernel_log_oom_for_container:
    params:
    - C
    says: node kubelet or kernel logs show the OOM killer firing for the container at the
      time of the issue
    sources:
    - source: aks-oomkilled
      quote: '[Review the kubelet logs](/azure/aks/kubelet-logs) on the node to see if any
        messages indicate that the OOM killer was triggered at the time of the issue and that
        the pod''s memory usage reached its limit.'
    - source: robusta-oom-killer
      quote: "    if params.dmesg_log and node:\n        dmesg_enricher(event, node, params.custom_annotations)"
  oom_event_recorded:
    params:
    - P
    says: events for the pod include OOM-related messages
    sources:
    - source: aks-oomkilled
      quote: Use `kubectl get events --sort-by=.lastTimestamp -n <namespace>` to find OOMKilled
        pods.
  container_command_not_persistent:
    params:
    - C
    says: the command or entrypoint of the container does not start a process that runs continuously
    sources:
    - source: gke-crashloopbackoff
      quote: a container remains running only as long as its initial process (command or entrypoint)
        does. If this process isn't a long-running service, the container exits as soon as
        the command completes.
  workload_is_long_running_controller:
    params:
    - W
    says: the pod belongs to a long-running controller (the workload is a Deployment, StatefulSet
      or ReplicaSet) rather than a Job
    sources:
    - source: gke-crashloopbackoff
      quote: Although this is the outcome that you want for a task-based Job, it can signal
        a problem for a long-running controller like a Deployment, StatefulSet, or ReplicaSet.
  logs_show_queue_empty_exit:
    params:
    - C
    says: the logs of the container show the app found no work in its queue and exited cleanly
    sources:
    - source: gke-crashloopbackoff
      quote: many worker apps are designed to check a queue for a task and exit cleanly if
        the queue is empty.
  config_file_missing_at_expected_path:
    params:
    - C
    says: a required configuration file is not present at the path container expects inside
      the container
    sources:
    - source: gke-crashloopbackoff
      quote: 'Configuration file presence: confirm that any required configuration files are
        present at the expected paths within the container.'
  config_content_invalid:
    params:
    - C
    says: the configuration container loads has syntax errors, missing mandatory fields or
      incorrect values
    sources:
    - source: gke-crashloopbackoff
      quote: 'Configuration file content: validate the content and format of your configuration
        files for syntax errors, missing mandatory fields, or incorrect values.'
  env_or_args_missing_expected:
    params:
    - C
    says: command-line arguments or environment variables the container expects are not passed
      to it
    sources:
    - source: gke-crashloopbackoff
      quote: 'App arguments or environment: ensure that all necessary command-line arguments
        and environment variables are correctly passed to the container as expected by your
        app.'
  configmap_volume_reference_mismatch:
    params:
    - P
    says: the ConfigMap named in the pod's volume definition is absent, empty, or its keys
      do not match the filenames the app expects
    sources:
    - source: gke-crashloopbackoff
      quote: If the ConfigMap isn't attached, is empty, or has misnamed keys, an app designed
        to exit when its configuration is missing might stop with an exit code of 0.
  logs_show_executable_not_found:
    params:
    - C
    says: the logs or termination message of the container show the entrypoint executable
      was not found or could not be run
    sources:
    - source: gke-crashloopbackoff
      quote: This issue can happen with newly deployed images where the path to the executable
        is wrong or the file itself is not present in the container image.
  image_tag_is_mutable:
    params:
    - C
    says: the image of the container is referenced by a mutable tag such as :latest rather
      than an immutable tag or digest
    sources:
    - source: gke-crashloopbackoff
      quote: To help ensure consistency and reproducibility, always use specific, immutable
        image tags (for example, v1.2.3) or SHA digests (for example, sha256:45b23dee08...)
        in production environments.
  logs_show_dependency_connection_failure:
    params:
    - C
    says: the logs of the container show it could not connect to a database, API or other
      service it depends on
    sources:
    - source: gke-crashloopbackoff
      quote: 'Dependency issues: your app might crash if it can''t connect to the other services
        it depends on, or if it fails to authenticate or has insufficient permissions to access
        them.'
  dependency_unreachable_from_pod:
    params:
    - P
    says: a command run from inside the pod cannot reach the dependency's URL or port
    sources:
    - source: gke-crashloopbackoff
      quote: For example, you can use a tool like curl to try and reach a service's URL.
  logs_show_auth_rejection:
    params:
    - C
    says: the logs of the container contain 401 Unauthorized or 403 Forbidden responses from
      a service it calls
    sources:
    - source: gke-crashloopbackoff
      quote: 'Authentication failures: the app might be unable to authenticate with external
        services due to incorrect credentials.'
  logs_show_timeout_waiting_for_dependency:
    params:
    - C
    says: the logs of the container show it timed out waiting for a response from an external
      service
    sources:
    - source: gke-crashloopbackoff
      quote: 'Timeouts: the app might experience timeouts when waiting for responses from
        external services, leading to crashes.'
  logs_show_port_already_in_use:
    params:
    - C
    says: the logs of the container show it failed to bind a port that is already in use
    sources:
    - source: gke-crashloopbackoff
      quote: 'Port conflicts: the app might fail to start if it attempts to bind to a port
        that is already in use by another process.'
  logs_show_missing_or_incompatible_library:
    params:
    - C
    says: the logs of the container show a missing or incompatible library or runtime dependency
    sources:
    - source: gke-crashloopbackoff
      quote: 'Incompatible libraries: the app might depend on libraries or dependencies that
        are missing or incompatible with the runtime environment.'
  app_stops_responding_without_exiting:
    params:
    - C
    says: the process in the container does not exit on its own but stops responding indefinitely
    sources:
    - source: gke-crashloopbackoff
      quote: In this scenario, the app might not exit, but it stops responding indefinitely.
  kubelet_logged_probe_restart:
    params:
    - C
    says: kubelet logs record that the container failed its liveness probe and will be restarted
    sources:
    - source: gke-crashloopbackoff
      quote: Container probe failed liveness probe, will be restarted
  many_pods_created_simultaneously:
    params:
    - W
    says: a large number of pods of the workload were created at the same time around the
      onset of the failures
    sources:
    - source: gke-crashloopbackoff
      quote: In scenarios where a large number of Pods are deployed simultaneously (for example,
        by a CI/CD tool like ArgoCD), a sudden surge of new Pods can overwhelm cluster resources,
        leading to control plane resource exhaustion.
  probe_command_is_heavy:
    params:
    - C
    says: the liveness probe's own execution for the container consumes significant resources
    sources:
    - source: gke-crashloopbackoff
      quote: In rare cases, the liveness probe's execution itself might consume significant
        resources, which could trigger resource constraints that potentially lead to the container
        being terminated due to an OOM kill.
  restarts_confined_to_one_node:
    params:
    - W
    - N
    says: the restarts in the workload are confined to its pods on the node while its pods
      elsewhere are stable
    sources:
    - source: vendored-kb
      quote: 'PodRestartSpike candidate cause: node issue'
  probe_endpoint_logs_show_errors:
    params:
    - C
    says: the logs of the process serving the probe endpoint show errors or unhealthy results
      for the container while the process keeps running
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed supporting evidence: events; probe endpoint logs; traces'
  probe_failure_rate_rising:
    params:
    - C
    says: the probe failure count for the container rises over the window
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed metric evidence: increase probe failure count/latency correlation'
  probe_failures_correlate_with_latency:
    params:
    - C
    says: probe failures for the container coincide with rising response latency
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed metric evidence: increase probe failure count/latency correlation'
  dependency_latency_in_traces:
    params:
    - C
    says: traces of the container's probe-path requests show a downstream dependency call
      taking the time
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed supporting evidence: events; probe endpoint logs; traces'
  startup_logs_show_progress:
    params:
    - C
    says: the container's startup logs show initialisation still progressing, without an error,
      up to the moment it was killed
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed supporting evidence: events; startup logs'
  startup_logs_show_error:
    params:
    - C
    says: the container's startup logs end with an error or failure during initialisation
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed supporting evidence: events; startup logs'
  startup_probe_budget_shorter_than_observed_startup:
    params:
    - C
    says: the startup probe's failureThreshold times periodSeconds for the container is shorter
      than the time its startup logs show initialisation taking
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed candidate cause: slow startup'
  startup_probe_target_wrong:
    params:
    - C
    says: the startup probe for the container targets a port, path or command the container
      never serves
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed candidate cause: bad probe'
  memory_working_set_trending_up:
    params:
    - C
    says: the container's working set memory trends steadily upward over the window
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing metric evidence: deriv(container_memory_working_set_bytes[15m])'
  memory_growth_tracks_request_rate:
    params:
    - C
    says: the container's memory growth follows its request rate rather than time
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing supporting evidence: memory time series; restart/OOM
        history; request rate'
  memory_plateaus_under_steady_load:
    params:
    - C
    says: the container's memory rises toward a ceiling and then holds there under steady
      load instead of rising without bound
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing supporting evidence: memory time series; restart/OOM
        history; request rate'
  logs_show_different_fatal_error:
    params:
    - Container
    says: the previous instance's logs end with a fatal error that names a different cause
    sources:
    - &id001
      source: gke-crashloopbackoff
      quote: 'Unhandled exceptions: the app logs might contain stack traces or error messages
        indicating unhandled exceptions or other code-related bugs.'
actions:
  read-container-statuses:
    requires: k8stools
    produces:
    - last_termination_reason
    - waiting_reason
    - waiting_message_names_cause
    - memory_limit_set
    - restart_count_increasing
    - restart_count_above_one
    - failing_container_is_init
    - init_container_crashloopbackoff
    - init_container_failed_to_execute
    call: get_pod_container_statuses
    read: 'for every app container and init container: the current state with its waiting
      reason and message, the restart count, and the last terminated instance with reason,
      exit code, started_at and finished_at, beside its resources'
    quality: partial
    limits: shows only the current state and the single most recent termination of each container;
      earlier instances and their reasons are not retained
    sources:
    - source: k8s-debug-pods
      quote: Look at the state of the containers in the pod. Are they all `Running`? Have
        there been recent restarts?
    - source: k8s-debug-init-containers
      quote: 'View more detailed information about Init Container execution:'
    - source: aks-pod-restarts
      quote: Under **Containers** (or **Init Containers**), check **State**, **Last State**,
        **Reason**, **Exit Code**, and **Restart Count**.
    - source: aks-oomkilled
      quote: In the output, check the **Container Statuses** section for indications of OOM
        kills.
    - source: gke-crashloopbackoff
      quote: In the output, review the Exit Code field located under the Last State section
        for the relevant container.
    - source: k8sgpt-pod-analyzer
      quote: // Check through container status to check for crashes or unready
    - source: robusta-restart-loop
      quote: all_statuses = status.containerStatuses + status.initContainerStatuses
    - source: robusta-oom-killer
      quote: '            container = get_oom_killed_container(pod, c_status)'
    - source: robusta-pod-investigator
      quote: all_statuses = pod.status.containerStatuses + pod.status.initContainerStatuses
    - source: vendored-kb
      quote: 'PodRestartSpike supporting evidence: restart counter; deployment change; termination
        reason; node events'
  read-pod-summaries:
    requires: k8stools
    produces:
    - init_containers_completed_count
    - init_containers_finished
    - pod_status_reason_evicted
    - pod_age_reset_at_incident
    - original_pod_gone
    - restart_count_increasing
    - restarts_confined_to_one_node
    - workload_is_long_running_controller
    - many_pods_created_simultaneously
    - other_pods_oom_killed_on_node
    - not_all_replicas_affected
    - last_termination_reason
    call: get_pod_summaries
    read: each pod's status, age, restarts, last_restart, node and controlling owner, and
      which pods of the workload show restarts while others do not
    quality: point
    limits: a snapshot of the pods that exist now; age is time since pod creation, not since
      the last restart, and pods already deleted are not listed
    sources:
    - source: k8s-debug-init-containers
      quote: 'Display the status of your pod:'
    - source: aks-pod-restarts
      quote: Check the affected workload's pod `AGE` and compare it with observations before
        the incident.
    - source: aks-oomkilled
      quote: Look for pods with statuses of `OOMKilled`.
    - source: gke-crashloopbackoff
      quote: These controllers work to help ensure a Pod is always running, so they treat
        any exit as a failure to be corrected.
    - source: k8sgpt-pod-analyzer
      quote: // Check for evicted pods
    - source: robusta-oom-killer
      quote: '    Add the list of pods on this node that we''re killed by the OOM killer.'
    - source: robusta-pod-investigator
      quote: pods_with_issues = [pod for pod in pods if detect_pod_issue(pod) != PodIssue.NoneDetected]
    - source: vendored-kb
      quote: 'PodRestartSpike supporting evidence: restart counter; deployment change; termination
        reason; node events'
  read-pod-events:
    requires: k8stools
    produces:
    - probe_failure_events_present
    - killing_event_follows_probe_failure
    - mount_failure_event
    call: get_pod_events
    read: 'the pod''s recent events with timestamps, counts and container fieldPath: Unhealthy
      and probe-failure entries, Killing entries for the same container, readiness failures,
      and FailedMount entries'
    quality: partial
    limits: events are retained only for a limited window, so older restarts or mount failures
      may leave no event behind
    sources:
    - source: k8s-debug-pods
      quote: 'Check the current state of the Pod and recent events with the following command:'
    - source: prom-kube-pod-crash-looping
      quote: Check pod events via `kubectl -n $NAMESPACE describe pod $POD`.
    - source: aks-pod-restarts
      quote: Check event messages, timestamps, counts, and the container `fieldPath` where
        available.
    - source: vendored-kb
      quote: 'LivenessProbeFailed event evidence: events; probe endpoint logs; traces'
  read-oom-events:
    requires: k8stools
    produces:
    - oom_event_recorded
    - pod_status_reason_evicted
    - eviction_message_states_reason
    call: get_events
    read: events in the namespace sorted by time, for OOM-related messages and Evicted entries
      with the message they carry
    quality: partial
    limits: events expire, so an older kill or eviction may leave no entry
    sources:
    - source: aks-oomkilled
      quote: 'Use the events section from the pod description to look for OOM-related messages:'
    - source: k8sgpt-pod-analyzer
      quote: if pod.Status.Message != "" {
  read-node-events:
    requires: k8stools
    produces: []
    call: get_events
    read: events whose involved object is the node the restarting pods run on
    quality: partial
    limits: node events age out, and a node that failed silently emits none
    sources:
    - source: vendored-kb
      quote: 'PodRestartSpike supporting evidence: restart counter; deployment change; termination
        reason; node events'
  read-crash-logs:
    requires: k8stools
    produces:
    - logs_show_dependency_wait
    - missing_file_error_in_logs
    - readonly_filesystem_error_in_logs
    - permission_denied_error_in_logs
    - operation_not_permitted_in_logs
    - logs_show_queue_empty_exit
    - logs_show_executable_not_found
    - logs_show_dependency_connection_failure
    - logs_show_auth_rejection
    - logs_show_timeout_waiting_for_dependency
    - logs_show_port_already_in_use
    - logs_show_missing_or_incompatible_library
    - logs_show_initialization_failure
    - logs_show_different_fatal_error
    call: get_logs_for_pod_and_container
    read: 'the previous terminated instance''s log tail with timestamps: stack traces, waits
      on another service, missing files or paths, read-only or permission errors, operation-not-permitted,
      connection, auth, timeout, port-bind and library messages'
    quality: partial
    limits: only what the process chose to write, and only for instances the runtime still
      retains; a process killed without writing leaves nothing
    sources:
    - source: prom-kube-pod-crash-looping
      quote: Check pod logs via `kubectl -n $NAMESPACE logs $POD -c $CONTAINER`
    - source: gke-crashloopbackoff
      quote: The --previous flag retrieves logs from the prior, terminated container, which
        is where you can find the specific stack trace or error message that reveals the cause
        of the crash.
    - source: aks-pod-restarts
      quote: Retrieve logs from the container instance before its most recent restart.
    - source: k8s-debug-init-containers
      quote: kubectl logs <pod-name> -c <init-container-2>
  read-startup-logs:
    requires: k8stools
    produces:
    - startup_logs_show_progress
    - startup_logs_show_error
    - startup_probe_budget_shorter_than_observed_startup
    call: get_logs_for_pod_and_container
    read: the initialisation lines of the current and previous instance, with timestamps,
      and how long initialisation was still progressing
    quality: partial
    limits: a container killed early may have written nothing, and only the last two instances
      are available
    sources:
    - source: vendored-kb
      quote: 'StartupProbeFailed supporting evidence: events; startup logs'
  read-probe-endpoint-logs:
    requires: k8stools
    produces:
    - probe_endpoint_logs_show_errors
    call: get_logs_for_pod_and_container
    read: log lines around each probe failure for health-endpoint errors
    quality: partial
    limits: only shows what the process chose to log; a process that answers slowly without
      logging leaves nothing
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed supporting evidence: events; probe endpoint logs; traces'
  read-probe-spec:
    requires: k8stools
    produces:
    - startup_probe_configured
    - probe_target_not_served
    - probe_thresholds_tighter_than_app_needs
    - probe_checks_external_dependency
    - startup_probe_target_wrong
    - restart_policy
    call: get_pod_spec
    read: 'the liveness and startup probe blocks: handler type, port, path or exec command,
      periodSeconds, timeoutSeconds, failureThreshold and initialDelaySeconds, beside the
      ports the container declares and the pod''s restart policy'
    quality: point
    limits: shows the probe as declared, not the responses the kubelet received nor how fast
      the endpoint actually answers
    sources:
    - source: prom-kube-pod-crash-looping
      quote: readiness and liveness probes may be incorrect - wrong port or command,
    - source: gke-crashloopbackoff
      quote: 'Misconfigured probes are a frequent cause of CrashLoopBackOff events. Check
        the following settings in the manifest of your probe:'
    - source: aks-pod-restarts
      quote: If events confirm a probe-triggered restart, review the probe settings in the
        pod description.
    - source: vendored-kb
      quote: 'StartupProbeFailed candidate cause: bad probe'
  read-pod-spec-command-and-image:
    requires: k8stools
    produces:
    - container_command_not_persistent
    - env_or_args_missing_expected
    - image_tag_is_mutable
    - command_absent_from_applied_spec
    call: get_pod_spec
    read: the container's command, args, env and image reference, as the apiserver stored
      them
    quality: point
    limits: shows what is declared now, not what the running instance received, which image
      content was pulled, or what the author meant to submit
    sources:
    - source: gke-crashloopbackoff
      quote: 'App arguments or environment: ensure that all necessary command-line arguments
        and environment variables are correctly passed to the container as expected by your
        app.'
    - source: k8s-debug-pods
      quote: For example, if you misspelled `command` as `commnd` then the pod will be created
        but will not use the command line you intended it to use.
  read-security-context:
    requires: k8stools
    produces:
    - readonly_root_filesystem_set
    - security_context_user_override
    - capabilities_restricted
    - working_dir_not_set_in_spec
    call: get_pod_spec
    read: the container's securityContext (runAsUser, capabilities, readOnlyRootFilesystem),
      its workingDir and its volume mounts
    quality: point
    limits: shows the declared template only, not what the process actually tried to do inside
      the container
    sources:
    - source: prom-kube-pod-crash-looping
      quote: Check template via `kubectl -n $NAMESPACE get pod $POD`.
  read-termination-message-policy:
    requires: k8stools
    produces:
    - termination_message_policy_fallback_to_logs
    call: get_pod_spec
    read: each container's terminationMessagePath and terminationMessagePolicy
    limits: shows the configured path and policy only, never whether the container wrote anything
      to that file
    sources:
    - source: k8s-pod-failure-reason
      quote: Kubernetes retrieves termination messages from the termination message file specified
        in the `terminationMessagePath` field of a Container, which has a default value of
        `/dev/termination-log`.
  read-termination-message:
    requires: human
    produces:
    - termination_message_recorded
    - termination_message_names_fatal_event
    - terminated_container_identified
    read: for each entry in the pod's container statuses, the container name and its last
      terminated message and exit code
    cost: 2
    quality: point
    limits: only the most recent termination of each container, and the kubelet truncates
      long messages, so an earlier or longer final status may be missing
    sources:
    - source: k8s-pod-failure-reason
      quote: 'Use a Go template to filter the output so that it includes only the termination
        message:'
  validate-submitted-manifest:
    requires: human
    produces:
    - spec_validation_reports_unknown_field
    read: whether validating the submitted manifest names an unknown field
    cost: 2
    quality: point
    limits: needs the original manifest from the author's machine, and the unknown-field message
      may be a false alarm
    sources:
    - source: k8s-debug-pods
      quote: For example, run `kubectl apply --validate -f mypod.yaml`.
  compare-applied-spec-with-intent:
    requires: human
    produces:
    - applied_spec_differs_from_intent
    read: lines present in the original pod description but absent from the object the apiserver
      returns
    cost: 2
    quality: point
    limits: the stored copy always carries extra defaulted lines, so only lines missing from
      it are meaningful, and the original description must be available
    sources:
    - source: k8s-debug-pods
      quote: For example, run `kubectl get pods/mypod -o yaml > mypod-on-apiserver.yaml` and
        then manually compare the original pod description, `mypod.yaml` with the one you
        got back from apiserver, `mypod-on-apiserver.yaml`.
  check-dependency-endpoints:
    requires: k8stools
    produces:
    - dependency_endpoints_not_ready
    call: get_endpoint_summaries
    read: the ready and not-ready backend counts of the Services the container talks to at
      startup
    quality: point
    limits: one sample now; cannot show whether the dependency was ready during an earlier
      start
    sources:
    - source: prom-kube-pod-crash-looping
      quote: app waits for other services to start, such as database
  check-referenced-objects:
    requires: k8stools
    produces:
    - referenced_configmap_or_secret_missing
    call: get_configmap_summaries
    read: whether the ConfigMaps and Secrets the pod template references exist in the namespace
    quality: point
    limits: shows existence now, not whether the key the process wanted was present at start
    sources:
    - source: prom-kube-pod-crash-looping
      quote: missing files such as configmaps/secrets/volumes
  read-configmap-for-volume:
    requires: k8stools
    produces:
    - configmap_volume_reference_mismatch
    call: get_configmap
    read: whether the ConfigMap named in the pod's volume exists, whether it has data, and
      whether its keys match the filenames the app expects
    quality: point
    limits: shows the ConfigMap as it is now; cannot show what the app expects to read unless
      the expected key names are known
    sources:
    - source: gke-crashloopbackoff
      quote: The keys within the ConfigMap match what your app expects to find as filenames
        in the mounted volume.
  check-node-memory:
    requires: k8stools
    produces:
    - node_memory_near_capacity
    call: get_node_metrics
    read: the node's current memory use against its allocatable memory
    quality: point
    limits: one sample now; it cannot show node memory at the moment of an earlier kill
    sources:
    - source: aks-oomkilled
      quote: '**Insufficient node resources**: The node doesn''t have enough memory to support
        the running pods, which leads to OOM kills.'
  read-node-memory-allocation:
    requires: k8stools
    produces:
    - node_allocated_memory_percent
    call: get_node_summaries
    read: the node's memory capacity and allocatable memory, and the share already taken by
      pod requests
    quality: point
    limits: declared capacity now, not actual memory usage
    sources:
    - source: robusta-oom-killer
      quote: "        allocatable_memory = PodResources.parse_mem(node.status.allocatable.get(\"\
        memory\", \"0Mi\"))\n        capacity_memory = PodResources.parse_mem(node.status.capacity.get(\"\
        memory\", \"0Mi\"))"
  read-node-conditions:
    requires: k8stools
    produces: []
    call: get_node_summaries
    read: the conditions and conditions_since, taints and allocatable of the node hosting
      the restarting container
    quality: point
    limits: conditions as they are now with time since each changed; a disruption that has
      cleared may no longer be visible
    sources:
    - source: gke-crashloopbackoff
      quote: 'Investigate Node Disruptions: are disruptions on the node resource causing container
        restarts?'
  read-workload-availability:
    requires: k8stools
    produces:
    - not_all_replicas_affected
    call: get_deployment_summaries
    read: available replicas against unavailable replicas for the workload
    quality: point
    limits: a current count only; it does not say which replica failed when, nor why
    sources:
    - source: robusta-pod-investigator
      quote: unavailable_replicas = resource.status.unavailableReplicas if resource.status.unavailableReplicas
        else 0
  query-cpu-series:
    requires: prometheus
    produces:
    - cpu_limit_reached_during_startup
    - container_cpu_saturated_during_probes
    - node_cpu_saturated
    call: query_range
    read: container CPU use and throttling against its limit, and node CPU contention, over
      the startup window and the probe intervals of recent lives
    cost: 2
    quality: partial
    limits: depends on scrape interval; very short lives or brief stalls can fall between
      samples, and it cannot show that an individual probe request timed out
    sources:
    - source: prom-kube-pod-crash-looping
      quote: not enough CPU which is required on start
    - source: aks-pod-restarts
      quote: CPU throttling or resource contention causes probe requests to time out. This
        behavior causes probe failures and subsequent container restarts.
    - source: gke-crashloopbackoff
      quote: 'Analyze CPU usage: monitor the CPU utilization of the affected container and
        the node it''s running on during the probe intervals.'
  query-node-disk-io:
    requires: prometheus
    produces:
    - node_disk_io_slow
    call: query_range
    read: node disk operation time for reads and writes around the restarts
    cost: 2
    quality: partial
    limits: node-level only; cannot attribute the I/O to a particular container
    sources:
    - source: gke-crashloopbackoff
      quote: 'Monitor disk I/O: check disk I/O metrics for the node.'
  query-kubelet-probe-logs:
    requires: logs-backend
    produces:
    - kubelet_logged_probe_restart
    read: kubelet log entries for the node reporting that this container failed its liveness
      probe and will be restarted
    cost: 2
    quality: partial
    limits: covers only the retention window of the log backend and only nodes whose kubelet
      logs are collected
    sources:
    - source: gke-crashloopbackoff
      quote: To confirm if liveness probe failures are triggering the CrashLoopBackOff event,
        query your kubelet logs.
  query-probe-failure-series:
    requires: prometheus
    produces:
    - probe_failure_rate_rising
    - probe_failures_correlate_with_latency
    call: query_range
    read: probe failure counts beside request latency over the same window
    cost: 2
    limits: scrape-interval resolution can miss a short stall between samples
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed metric evidence: increase probe failure count/latency correlation'
  trace-probe-dependency-latency:
    requires: tracing
    produces:
    - dependency_latency_in_traces
    read: spans on the probe path for time spent in downstream dependency calls
    cost: 3
    quality: partial
    limits: only sampled, instrumented requests appear; an uninstrumented dependency is invisible
    sources:
    - source: vendored-kb
      quote: 'LivenessProbeFailed supporting evidence: events; probe endpoint logs; traces'
  query-restart-counter:
    requires: prometheus
    produces:
    - onset_observed
    call: query_range
    read: the increase in container restart count over the window
    cost: 2
    limits: counts restarts, saying nothing about why each instance ended
    sources:
    - source: vendored-kb
      quote: 'PodRestartSpike metric evidence: increase(kube_pod_container_status_restarts_total[15m])'
  query-working-set-series:
    requires: prometheus
    produces:
    - memory_working_set_trending_up
    - memory_plateaus_under_steady_load
    call: query_range
    read: container working set bytes and its derivative over the window
    cost: 2
    limits: shows total working set, not which allocation inside the process grows
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing metric evidence: deriv(container_memory_working_set_bytes[15m])'
  query-request-rate-against-memory:
    requires: prometheus
    produces:
    - memory_growth_tracks_request_rate
    call: query_range
    read: request rate beside the memory series over the same window
    cost: 2
    limits: correlation over one window only; a slow leak under rising traffic looks similar
    sources:
    - source: vendored-kb
      quote: 'MemoryWorkingSetGrowing supporting evidence: memory time series; restart/OOM
        history; request rate'
  query-container-max-memory:
    requires: prometheus
    produces:
    - container_memory_near_limit
    call: query_range
    read: the container's maximum memory use over the window compared with its specified memory
      limit
    cost: 2
    quality: partial
    limits: covers only the queried window, and says nothing when the container has no memory
      limit to compare against
    sources:
    - source: robusta-oom-killer
      quote: '        container_max_used_memory_in_bytes = self.memory_analyzer.get_container_max_memory_usage_in_bytes('
  query-node-max-memory:
    requires: prometheus
    produces:
    - node_memory_near_capacity
    call: query_range
    read: the node's maximum memory use over the window as a percentage of its available memory
    cost: 2
    quality: partial
    limits: covers only the queried window and attributes nothing to a single container
    sources:
    - source: robusta-oom-killer
      quote: '        node_max_used_memory_in_percentage = self.memory_analyzer.get_max_node_memory_usage_in_percentage('
  read-pod-replacement-audit:
    requires: audit-log
    produces:
    - audit_shows_pod_delete_or_evict
    read: pod deletion, creation, eviction or workload-update operations in the namespace
      at the incident time, with the operation, timestamp and initiating user or controller
    cost: 2
    quality: partial
    limits: only retained audit records are available; enabling collection now does not recover
      earlier operations
    sources:
    - source: aks-pod-restarts
      quote: Review Kubernetes audit logs for the namespace and incident time to identify
        pod deletion, creation, eviction, or workload updates, including the operation, timestamp,
        and initiating user or controller.
  read-node-oom-logs:
    requires: human
    produces:
    - kernel_log_oom_for_container
    read: kubelet or kernel logs on the node for lines showing the OOM killer terminated a
      process of this container
    cost: 3
    quality: partial
    limits: needs access to the node itself, and the kernel ring buffer or node log retention
      may already have dropped the entry
    sources:
    - source: aks-oomkilled
      quote: 'Alternatively, [SSH into the node](/azure/aks/node-access) where the pod was
        running and check the kernel logs for any OOM messages. This command displays which
        processes the OOM killer terminated:'
    - source: robusta-oom-killer
      quote: "    if params.dmesg_log and node:\n        dmesg_enricher(event, node, params.custom_annotations)"
  read-cgroup-memory-in-container:
    requires: human
    produces:
    - container_memory_near_limit
    read: the container's cgroup current memory value compared with its memory limit
    cost: 3
    quality: point
    limits: needs a shell in the container; one sample only, so it cannot show growth or the
      value at the time of the kill
    sources:
    - source: aks-oomkilled
      quote: 'If metrics are unavailable, you can inspect cgroup stats directly:'
  inspect-inside-pod:
    requires: human
    produces:
    - dependency_unreachable_from_pod
    - config_file_missing_at_expected_path
    - probe_target_not_served
    read: 'the result of commands run inside the pod: reaching the dependency''s URL or port,
      listing the expected configuration files, running the probe''s command and requesting
      the probe''s path'
    cost: 3
    quality: point
    limits: one sample taken now from a container that may be a fresh instance; it cannot
      show the state at the moment of an earlier crash
    sources:
    - source: gke-crashloopbackoff
      quote: After you connect to the Pod, you can run commands to check for access to files,
        databases, or to test the network.
  validate-config-file-content:
    requires: human
    produces:
    - config_content_invalid
    read: the content and format of the configuration the container loads, checking syntax,
      mandatory fields and values
    cost: 2
    quality: point
    limits: judges the configuration as it stands now and depends on knowing what the app
      considers valid
    sources:
    - source: gke-crashloopbackoff
      quote: 'Configuration file content: validate the content and format of your configuration
        files for syntax errors, missing mandatory fields, or incorrect values.'
  check-app-responsiveness:
    requires: human
    produces:
    - app_stops_responding_without_exiting
    read: whether the process is still alive but no longer answering requests
    cost: 3
    quality: point
    limits: a single observation; it cannot show whether the app was also stuck during earlier
      restart cycles
    sources:
    - source: gke-crashloopbackoff
      quote: 'Deadlocks or livelocks: the app might be stuck in a deadlock, where multiple
        processes are waiting for each other to complete.'
  review-probe-command-weight:
    requires: human
    produces:
    - probe_command_is_heavy
    read: what the probe command or request actually does and how much CPU and memory its
      execution needs
    cost: 2
    quality: point
    limits: an assessment of the probe itself; it does not measure the probe's consumption
      at the time of a kill
    sources:
    - source: gke-crashloopbackoff
      quote: Ensure your probe commands are lightweight.
  inspect-probe-logic:
    requires: human
    produces:
    - probe_checks_external_dependency
    read: 'what the liveness probe endpoint actually validates: that the process is running
      and responsive, or full application and dependency validation'
    cost: 3
    quality: point
    limits: requires someone to read the application's health-check implementation; it is
      not visible from the cluster API
    sources:
    - source: aks-pod-restarts
      quote: Keep liveness probes lightweight by validating only that the application process
        is running and responsive, instead of performing full dependency checks.
claims:
  silently-ignored-spec-field:
    title: silently ignored spec field
    confirm:
    - spec_validation_reports_unknown_field[W]
    - applied_spec_differs_from_intent[P]
    refute:
    - - not spec_validation_reports_unknown_field[W]
      - not applied_spec_differs_from_intent[P]
    supports:
    - command_absent_from_applied_spec[C]
    note: A key in the pod description was mistyped or mis-nested, so it was silently ignored
      and the container runs with settings the author never intended. The pod is created successfully,
      so nothing rejects it; the evidence is the difference between the submitted description
      and the object that was stored.
    sources:
    - source: k8s-debug-pods
      quote: Often a section of the pod description is nested incorrectly, or a key name is
        typed incorrectly, and so the key is ignored.
    refute_drafted: true
  work-completed-exit-zero:
    title: process exits cleanly and is restarted
    confirm:
    - - last_exit_code[C, 0]
      - termination_message_recorded[C]
      - not termination_message_names_fatal_event[C]
    - - last_exit_code[C, 0]
      - not process_logged_fatal_error[C]
    - - last_exit_code[C, 0]
      - restart_policy[P, Policy], Policy == Always
      - restart_count_increasing[C]
    - - last_termination_reason[C, Reason], Reason == Completed
      - restart_policy[P, Policy], Policy == Always
    refute:
    - last_exit_code[C, Code], Code != 0
    - termination_message_names_fatal_event[C]
    - last_termination_reason[C, Reason], Reason == OOMKilled
    supports:
    - completes_startup_each_life[C]
    - not probe_failure_events_present[C]
    refined_by:
    - command-not-persistent
    - worker-exits-empty-queue
    note: The process finished its work and exited cleanly, and the restart policy started
      it again. The container status carries a termination message and an exit code on success
      as well as on failure; a clean exit that is restarted shows exit code 0 with a final
      status reporting completion rather than a fatal event.
    sources:
    - source: k8s-pod-failure-reason
      quote: After the container writes the "Sleep expired" message, it terminates.
    - source: aks-pod-restarts
      quote: '| `Completed` or exit `0`, followed by another start | Check restart policy.
        For a short-lived process under `Always`, consider a job instead of a service. |'
    refute_drafted: true
  command-not-persistent:
    title: command is not a long-running process
    confirm:
    - - last_exit_code[C, 0]
      - container_command_not_persistent[C]
      - workload_is_long_running_controller[W]
    refute:
    - last_exit_code[C, Code], Code != 0
    - not container_command_not_persistent[C]
    supports:
    - not process_logged_fatal_error[C]
    - restart_policy[P, Policy], Policy == Always
    note: The container's initial process is not a long-running service, so it finishes and
      the container exits. Exit code 0 from a pod of a Deployment, StatefulSet or ReplicaSet
      is an unexpected successful exit that the default restart policy turns into a loop.
    sources:
    - source: gke-crashloopbackoff
      quote: 'Container command doesn''t start a persistent process: a container remains running
        only as long as its initial process (command or entrypoint) does.'
    refute_drafted: true
  worker-exits-empty-queue:
    title: worker exits on an empty queue
    confirm:
    - - last_exit_code[C, 0]
      - logs_show_queue_empty_exit[C]
    refute:
    - last_exit_code[C, Code], Code != 0
    supports:
    - workload_is_long_running_controller[W]
    sources:
    - source: gke-crashloopbackoff
      quote: 'Worker app exits when a work queue is empty: many worker apps are designed to
        check a queue for a task and exit cleanly if the queue is empty.'
    refute_drafted: true
    note: The worker app finds its queue empty and exits cleanly, and is restarted.
  unhandled-exception:
    title: unhandled exception
    confirm:
    - - process_logged_fatal_error[C]
      - last_exit_code[C, Code], Code != 0
    - - termination_message_names_fatal_event[C]
      - last_exit_code[C, Code], Code != 0
    - - termination_message_names_fatal_event[C]
      - terminated_container_identified[P, C]
    refute:
    - - last_exit_code[C, 137]
      - not process_logged_fatal_error[C]
    - last_exit_code[C, 0]
    supports:
    - completes_startup_each_life[C]
    - termination_message_policy_fallback_to_logs[C]
    - logs_show_initialization_failure[C]
    note: The application's own code hits a fatal error or unhandled exception and the process
      dies. With terminationMessagePolicy FallbackToLogsOnError, the last chunk of log output
      stands in for an empty termination message when the container exited with an error.
    sources:
    - *id001
    - source: k8s-pod-failure-reason
      quote: Termination messages provide a way for containers to write information about
        fatal events to a location where it can be easily retrieved and surfaced by tools
        like dashboards and monitoring software.
    refute_drafted: true
  port-conflict:
    title: port already in use
    confirm:
    - logs_show_port_already_in_use[C]
    refute:
    - completes_startup_each_life[C]
    - logs_show_different_fatal_error[C]
    supports:
    - exits_before_listener[C]
    - last_exit_code[C, Code], Code != 0
    sources:
    - source: gke-crashloopbackoff
      quote: 'Port conflicts: the app might fail to start if it attempts to bind to a port
        that is already in use by another process.'
    refute_drafted: true
    note: The app cannot bind its port because another process already holds it.
  incompatible-libraries:
    title: missing or incompatible library
    confirm:
    - logs_show_missing_or_incompatible_library[C]
    refute:
    - completes_startup_each_life[C]
    - logs_show_different_fatal_error[C]
    supports:
    - exits_before_listener[C]
    sources:
    - source: gke-crashloopbackoff
      quote: 'Incompatible libraries: the app might depend on libraries or dependencies that
        are missing or incompatible with the runtime environment.'
    refute_drafted: true
    note: A library or runtime dependency the app needs is missing or incompatible.
  invalid-entrypoint:
    title: wrong entrypoint or command
    confirm:
    - logs_show_executable_not_found[C]
    - - last_exit_code[C, 128]
      - onset_observed[W]
      - changed_before_onset[W, image]
    - - last_exit_code[C, 128]
      - onset_observed[W]
      - changed_before_onset[W, spec]
    refute:
    - last_exit_code[C, 0]
    - completes_startup_each_life[C]
    - logs_show_different_fatal_error[C]
    supports:
    - exits_before_listener[C]
    sources:
    - source: gke-crashloopbackoff
      quote: 'Invalid entrypoint or command: the command specified in the container''s entrypoint
        or command field might be incorrect.'
    refute_drafted: true
    note: The entrypoint or command names an executable that is wrong or absent in the image.
  run-container-error:
    title: runtime cannot start the container
    confirm:
    - waiting_reason[C, R], R == RunContainerError
    - waiting_reason[C, R], R == CreateContainerError
    - - last_termination_reason[C, R], R == StartError
      - last_exit_code[C, 128]
    refute:
    - - waiting_reason[C, R], R != RunContainerError, R != CreateContainerError
      - last_termination_reason[C, Rs], Rs != StartError
    - process_logged_fatal_error[C]
    supports:
    - waiting_message_names_cause[C]
    - not process_logged_fatal_error[C]
    note: The runtime cannot create or run the container's process, so it never ran. If the
      container wrote its own fatal error, its process did start and the runtime did not fail
      to run it.
    sources:
    - source: k8sgpt-pod-analyzer
      quote: '"PreStartHookError", "RunContainerError", "ImageInspectError", "ErrImagePull",
        "ErrImageNeverPull", "InvalidImageName",'
    - source: gke-crashloopbackoff
      quote: 'failed to create containerd task: failed to create shim task: context deadline
        exceeded: unknown'
    refute_drafted: true
  lifecycle-hook-failure:
    title: lifecycle hook fails
    confirm:
    - waiting_reason[C, R], R == PreStartHookError
    - waiting_reason[C, R], R == PreCreateHookError
    refute:
    - waiting_reason[C, R], R != PreStartHookError, R != PreCreateHookError
    - the container's spec defines no lifecycle hook
    supports:
    - waiting_message_names_cause[C]
    sources:
    - source: k8sgpt-pod-analyzer
      quote: '"PreStartHookError", "RunContainerError", "ImageInspectError", "ErrImagePull",
        "ErrImageNeverPull", "InvalidImageName",'
    refute_drafted: true
    note: A lifecycle hook on the container fails, so the container is torn down and retried.
  container-config-error:
    title: referenced configuration missing
    confirm:
    - waiting_reason[C, R], R == CreateContainerConfigError
    refute:
    - waiting_reason[C, R], R != CreateContainerConfigError
    - last_exit_code[C, Code], Code != 0
    supports:
    - waiting_message_names_cause[C]
    note: The container cannot be created because the configuration it references is missing
      or invalid. A container held in CreateContainerConfigError never gets as far as running
      its process; a non-zero last exit code means it did start, so this is not the cause.
    sources:
    - source: k8sgpt-pod-analyzer
      quote: '"CrashLoopBackOff", "ImagePullBackOff", "CreateContainerConfigError", "PreCreateHookError",
        "CreateContainerError",'
    refute_drafted: true
  evicted-by-kubelet:
    title: pod evicted
    confirm:
    - pod_status_reason_evicted[P]
    refute:
    - not pod_status_reason_evicted[P]
    supports:
    - eviction_message_states_reason[P]
    note: The pod was evicted, so its containers were terminated. The eviction message is
      what says which pressure or condition drove the eviction.
    sources:
    - source: k8sgpt-pod-analyzer
      quote: if pod.Status.Reason == "Evicted" {
    refute_drafted: true
  pod-replaced:
    title: pod replaced, not restarted
    confirm:
    - - pod_age_reset_at_incident[P]
      - original_pod_gone[P]
    - - pod_age_reset_at_incident[P]
      - audit_shows_pod_delete_or_evict[P]
    refute:
    - - not pod_age_reset_at_incident[P]
      - restart_count_increasing[C]
    - - not audit_shows_pod_delete_or_evict[P]
      - not original_pod_gone[P]
    supports:
    - audit_shows_pod_delete_or_evict[P]
    note: The pod was replaced rather than its container restarting. Pod age measures time
      since pod creation, not the last container restart, and a young pod can be an additional
      replica, so compare it with the original pod.
    sources:
    - source: aks-pod-restarts
      quote: Pod replacement can result from a deployment update, deletion, eviction, or node
        maintenance.
    refute_drafted: true
    refined_by:
    - evicted-by-kubelet
  failing-init-container:
    title: init container failing
    confirm:
    - init_container_crashloopbackoff[C]
    - - init_container_failed_to_execute[C]
      - last_exit_code[C, Code], Code != 0
    - - failing_container_is_init[C]
      - waiting_reason[C, R], R == CrashLoopBackOff
    refute:
    - init_containers_finished[P]
    - init_containers_completed_count[P, Done, Total], Done == Total
    - not failing_container_is_init[C]
    supports:
    - init_containers_completed_count[P, Done, Total], Done < Total
    - restart_count_above_one[C]
    - process_logged_fatal_error[C]
    refined_by:
    - application-crash
    - bad-config
    note: 'The pod''s restarts come from an init container that fails and is retried, not
      from an app container. Locates the failure in the init phase: the pod never reaches
      its app containers, so the retries are of an init container.'
    sources:
    - source: k8s-debug-init-containers
      quote: '`Init:CrashLoopBackOff` | An Init Container has failed repeatedly.'
    - source: robusta-restart-loop
      quote: all_statuses = status.containerStatuses + status.initContainerStatuses
  dependency-unavailable-at-startup:
    title: dependency unavailable at startup
    confirm:
    - - logs_show_dependency_wait[C]
      - exits_before_listener[C]
    - - logs_show_dependency_wait[C]
      - dependency_endpoints_not_ready[S]
    - - logs_show_dependency_connection_failure[C]
      - last_exit_code[C, Code], Code != 0
    - dependency_unreachable_from_pod[P]
    refute:
    - logs_show_different_fatal_error[C]
    - - not logs_show_dependency_wait[C]
      - completes_startup_each_life[C]
    supports:
    - exits_before_listener[C]
    - dependency_endpoints_not_ready[S]
    - not completes_startup_each_life[C]
    note: A service the process depends on at startup is unreachable, too slow, or refuses
      it. The container dies during startup because something it needs, such as a database,
      is not yet serving or is unreachable.
    sources:
    - source: prom-kube-pod-crash-looping
      quote: app waits for other services to start, such as database
    - source: gke-crashloopbackoff
      quote: 'External service unavailable: the app might depend on external services (for
        example, databases or APIs) that are unreachable due to network connectivity problems
        or service outages.'
    refute_drafted: true
    refined_by:
    - dependency-auth-failure
    - dependency-timeout
  dependency-auth-failure:
    title: dependency rejects credentials
    confirm:
    - - logs_show_auth_rejection[C]
      - last_exit_code[C, Code], Code != 0
    refute:
    - logs_show_different_fatal_error[C]
    supports:
    - logs_show_dependency_connection_failure[C]
    sources:
    - source: gke-crashloopbackoff
