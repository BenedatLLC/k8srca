refinements:
  unbound-persistent-volume-claim:
  - requested-storage-class-does-not-exist
  - no-class-requested-and-no-default-class
  - no-matching-static-volume
  - storage-class-provisioner-not-running
  - volume-provisioning-failed
  - waiting-for-first-consumer
  volume-node-affinity-conflict:
  - immediate-binding-ignores-pod-topology
  - volume-zone-lacks-available-node
  - single-zone-backend-provisioned-outside-pod-zone
  - allowed-topologies-excludes-candidate-nodes
  - node-affinity-updated-after-data-migration
converts:
  PVCPending:
    no provisioner: storage-class-provisioner-not-running
    bad StorageClass: requested-storage-class-does-not-exist
    insufficient capacity: storage-backend-capacity-exhausted
  FailedAttachVolume:
    CSI/cloud issue: csi-attach-failure
    multi-attach: volume-already-attached-to-another-node
  FailedMount:
    CSI failure: csi-mount-failure
    permissions: volume-permission-denied
    missing volume: missing-mounted-resource
  MultiAttachError:
    RWO volume used concurrently: rwo-volume-used-concurrently
  CSIControllerDown:
    CSI pod crash: csi-controller-pod-crashing
    node/control-plane issue: csi-controller-unavailable
  VolumeFull:
    retention/data growth: data-retention-not-enabled
    insufficient volume size: volume-size-too-small
  StorageLatencyHigh:
    backend saturation: storage-latency
    network storage latency: storage-latency
