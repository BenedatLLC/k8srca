# A container that keeps restarting, and the OOM kill that is one way it happens.
#
# Format: design 007 §3. This is the first conversion: CrashLoopBackOff and
# OOMKilled from the vendored KB, with the discriminators that used to live in
# docs/rca/discriminators.yaml. It is a conversion, not a rewrite -- every
# criterion below says what the authored discriminator said, and nothing more,
# so a score change from it is the format and not new knowledge (007 §11).
#
# Rules for anything added here, carried over from discriminators.yaml:
#
# * **Generic.** True of any cluster. Anything specific to one deployment
#   belongs in that cluster's architecture notes, or in its runbooks (007 §9).
# * **Observable, or said not to be.** Every fact has an action that produces
#   it, and every action names the capability it needs. A fact only an
#   unavailable capability can produce is a gap, never an absence (007 §4.2).
# * **Refutation carries more weight than confirmation.** Every claim has a
#   `rules_out`; the build fails without one.
# * **Scoped to the record (008 §4.1).** A fact says what was observed and over
#   what. One that quantifies over all time ("every", "never", "first") says
#   "retained", or an action producing it reads the whole history.
#
# Conditions: `fact[Args]`, optionally `not fact[Args]` (checked and false --
# never "not looked at"), optionally followed by comparisons on its variables.
# An alternative that is a list holds only when every condition in it does.
# Anything that does not parse as a condition is prose, which the build counts.
#
# Weights (008 §4.2). `for` and `against` are alternatives with a weight:
# strong (rarely seen unless the claim holds), moderate (clearly favours it),
# weak (leans toward it). A claim's support is the highest `for` that holds; a
# strong `against` lowers it two grades, a moderate one grade, and a weak one
# nothing, but the answer owes it a sentence. `rules_out` is decisive.
#
# Timing (007 §3.4). "Something changed" is evidence of a cause only when the
# onset is observed and the change took effect just before it. Every claim says
# so with the same two facts -- `onset_observed[W]`, and
# `changed_before_onset[X, Kind]` with a kind from `changes` below, which says
# when that kind of change takes effect -- and the build fails on an
# alternative that names a change without the onset, or on a timing fact coined
# instead.

symptoms:
  pod-restarting:
    title: Container repeatedly restarts
    claims: [application-crash, bad-config, oom-kill, failed-liveness-probe]
  container-oom-killed:
    title: Container terminated for memory
    claims: [memory-limit-too-low, memory-leak, workload-spike]

alerts:
  CrashLoopBackOff:     {symptom: pod-restarting}
  KubePodCrashLooping:  # kube-prometheus
    symptom: pod-restarting
    bind: {Pod: labels.pod, Namespace: labels.namespace, Container: labels.container}
  OOMKilled:            {symptom: container-oom-killed}

facts:
  last_exit_code:
    params: [Container, Code]
    functional: true
    says: "the container's last termination exit code is {Code}"
  process_logged_fatal_error:
    params: [Container]
    says: >-
      the process's own logs end with an exception, stack trace or fatal error
      before the cut
  last_termination_reason:
    params: [Container, Reason]
    functional: true
    says: the reason recorded for the container's last termination is {Reason}
  memory_limit_plausibly_reached:
    params: [Container]
    says: the memory limit is one the workload plausibly reaches
  killed_in_every_retained_life:
    params: [Container]
    says: >-
      every termination the record retains was a kill -- the last state, the
      previous instance's when it is shown, and the terminations the event
      series implies over its span -- with no period of healthy operation
      between them
  healthy_period_before_kills:
    params: [Container]
    says: >-
      the record shows the container running healthily for a long period on
      this same limit before the kills began
  onset_observed:
    params: [Workload]
    # An event series' first_seen is not the onset: kb_query's timing note
    # says so wherever this is used.
    says: >-
      when the failures began is observed: the first failure itself is in what
      events, metrics or history retain
  changed_before_onset:
    params: [Target, Kind]
    says: "{Kind} changed just before the failures began, as that kind of change takes effect"
  limit_equals_request:
    params: [Container, Resource]
    says: "the container's {Resource} limit equals its request"
  runtime_sizing_flags_set:
    params: [Container]
    says: heap or arena sizing flags are set for the runtime
  # Lifetime, not restart interval. How long each instance runs before it is
  # killed is one quantity; how often the container restarts is another, set
  # largely by the kubelet's back-off. The discriminators said "time-to-kill",
  # which reads as either, and a measured answer stated the lifetime as the
  # restart interval ("killed every 2-8 seconds"). The leak criterion is about
  # lifetime: memory has to accumulate within one instance.
  lifetime_steady_or_shortening:
    params: [Container]
    says: >-
      instance lifetime (how long each instance runs before it is killed) is
      roughly constant or shortening across many restarts
  lifetime_varies_without_trend:
    params: [Container]
    says: instance lifetime varies widely with no trend across restarts
  completes_startup_in_retained_lives:
    params: [Container]
    says: >-
      in each life the record retains, the container completes startup and
      serves for a while (it reaches readiness)
  memory_grows_within_life:
    params: [Container]
    says: memory climbs monotonically within each life rather than spiking
  load_rise_coincides_with_kills:
    params: [Container]
    says: >-
      kills coincide with a rise in request rate, queue depth or consumer lag
  kills_evenly_spaced_under_flat_load:
    params: [Container]
    says: the kills are evenly spaced through a period of flat or absent load
  peers_share_kill_timing:
    params: [Container]
    says: peers handling the same traffic show the same kill timing
  logs_name_invalid_setting:
    params: [Container]
    says: the logs name a missing or invalid setting
  exits_before_listener:
    params: [Container]
    says: the process exits before opening its listener
  healthy_on_same_config:
    params: [Workload]
    says: >-
      the workload has been unchanged for a long period and ran healthily on
      this same configuration before the failures began
  liveness_probe_configured:
    params: [Container]
    says: a liveness probe is configured on the container
  probe_failures_before_restarts:
    params: [Container]
    says: >-
      events show Unhealthy or probe-failure entries immediately before each
      restart
  restarts_before_initial_delay:
    params: [Container]
    says: "restarts happen sooner than the probe's initialDelaySeconds"

actions:
  read-container-state:
    requires: k8stools
    call: get_workload_report
    read: >-
      Each container's last terminated state: exit code, and `ran_for` -- how
      long that one instance lived, which is not how often the container
      restarts. get_pod_container_statuses gives the same for one pod.
    quality: partial
    limits: >-
      `ran_for` is the last terminated instance's lifetime only; a trend across
      many lifetimes is not visible here.
    produces: [last_exit_code, last_termination_reason, completes_startup_in_retained_lives,
               restarts_before_initial_delay, lifetime_steady_or_shortening,
               lifetime_varies_without_trend]
    cost: 1
  read-container-spec:
    requires: k8stools
    call: get_pod_spec
    read: Resources, probes, and the command, args and env the runtime starts with.
    produces: [limit_equals_request, runtime_sizing_flags_set,
               liveness_probe_configured, restarts_before_initial_delay]
    cost: 1
  sample-memory-now:
    requires: k8stools
    call: get_container_metrics
    read: Current usage against the limit.
    quality: point
    limits: >-
      One sample, taken now. It can show usage near the limit; it cannot show
      growth within a life, a peak, or anything before the sample.
    produces: [memory_limit_plausibly_reached]
    cost: 1
  read-events:
    requires: k8stools
    call: get_events
    read: >-
      Kill, back-off and probe events for the workload's pods: a count over the
      span from first_seen to last_seen gives the restart interval, which is
      not an instance's lifetime. Compare across replicas.
    quality: partial
    limits: >-
      A series keeps its first_seen while it recurs, so a workload still
      failing can show events days old. first_seen says the failures were
      already happening then, not that they began then: a pod recreated since
      starts a new series. It is the onset only if something shows the
      container healthy just before it.
    produces: [killed_in_every_retained_life, healthy_period_before_kills,
               peers_share_kill_timing, probe_failures_before_restarts,
               onset_observed]
    cost: 1
  read-previous-logs:
    requires: k8stools
    call: get_logs_for_pod_and_container
    read: >-
      The previous instance's logs (previous=true): how it ended, and whether it
      got as far as serving.
    quality: partial
    limits: >-
      An error from this call, or a log tail in a workload report marked
      available: false, is not a log. That instance's log file is gone
      (k8stools 4.0 raises rather than return the kubelet's message), and
      nothing about how it ended follows: not a clean end, and not the absence
      of an exception.
    produces: [process_logged_fatal_error, logs_name_invalid_setting,
               exits_before_listener, completes_startup_in_retained_lives]
    cost: 2
  read-rollout-history:
    requires: k8stools
    call: get_workload_history
    read: >-
      When the workload's image, limits and pod template last changed. A
      revision is a cause only lined up against an observed onset.
    quality: partial
    limits: >-
      ConfigMap and Secret *edits* leave no ReplicaSet revision, so "the workload
      spec is unchanged" does not establish that the configuration is unchanged.
    produces: [healthy_period_before_kills, healthy_on_same_config]
    cost: 2
  # Prometheus, through promtools (design 009 §6). Its two reports answer the
  # questions most of these facts ask, with their caveats attached as `notes`;
  # query_range is for what they do not cover. Each limit below is a trap
  # found on a real cluster (009 §2), not a hypothetical. The window is what
  # Prometheus retains, so nothing here is `scope: history`.
  read-memory-report:
    requires: prometheus
    call: memory_report
    read: >-
      Working-set peak and median against the memory limit over the window, per
      container, or per pod where the runtime reports only pods.
    quality: partial
    limits: >-
      A sampled peak, not the peak: usage between samples is unseen, and a life
      shorter than the scrape interval may get no sample at all. A peak at the
      limit says the limit was reached; a peak below it does not say it was not.
      A pod-level row (no container label) is the pod's cgroup, which for a
      one-container pod is that container. Its oom_events counts the pod
      cgroup's own OOM events, not kills of a container inside it, so a zero
      there is not evidence against an OOM kill.
    produces: [memory_limit_plausibly_reached]
    cost: 1
  # Replaces the mined action of the same name, whose limits missed retention.
  query-restart-counter:
    requires: prometheus
    call: restart_report
    read: >-
      Restarts over the window and per hour, hours without a restart, and the
      first restart in the window.
    quality: partial
    limits: >-
      Restarts per hour is the cadence, set largely by the kubelet's back-off,
      not how long each instance lived. The window is what Prometheus retains:
      a count above zero at its first sample means the restarts began before
      it, and the onset is not observed.
    produces: [onset_observed, healthy_period_before_kills]
    cost: 1
  query-memory-series:
    requires: prometheus
    call: query_range
    read: >-
      container_memory_working_set_bytes for the container, at the scrape
      interval, across several lives.
    quality: partial
    limits: >-
      A life shorter than the scrape interval has at most one sample, so growth
      within it cannot be seen: no climb in that case is unseen, not absent.
      Where the runtime reports only pod-level cgroups, the series carries no
      container label.
    produces: [memory_grows_within_life]
    cost: 2
  query-load-series:
    requires: prometheus
    call: query_range
    read: Request rate, queue depth or consumer lag for the workload, against the kill times.
    quality: partial
    limits: >-
      Which load series exist depends on how the workload is instrumented. No
      series for it is a gap, not flat load.
    produces: [load_rise_coincides_with_kills, kills_evenly_spaced_under_flat_load]
    cost: 3
  read-config-audit:
    requires: audit-log
    read: Who changed which ConfigMap or Secret, and when.
    produces: [healthy_on_same_config]
    cost: 3

# Kinds of change, and when each takes effect (007 §3.4). `seen_by` names the
# actions that can see one; a kind no available action sees is a gap.
changes:
  image:
    title: the image
    takes_effect: >-
      As the rollout replaces pods: within minutes of it starting, and only in
      pods it has replaced. A mutable tag that now resolves to a different
      digest changes the image with no new revision; it takes effect on the
      next pull.
    seen_by: [read-rollout-history]
  resources:
    title: the requests or limits
    takes_effect: >-
      As the rollout replaces pods, on each new pod's first start. A limit too
      small for the workload fails the first life of every new pod.
    seen_by: [read-rollout-history]
  spec:
    title: the pod template (command, args, env, probes, security context)
    takes_effect: As the rollout replaces pods, within minutes of it starting.
    seen_by: [read-rollout-history]
  config:
    title: a ConfigMap or Secret the workload reads
    takes_effect: >-
      When the process next reads it: at its next start for environment
      variables and files read once, within about a minute for a mounted file
      it watches. An edit can sit unread for days, so the onset to line it up
      with is the first restart after the edit, not the edit itself.
    seen_by: [read-config-audit]

claims:
  oom-kill:
    title: OOM
    for:
      - when: ["last_exit_code[C, 137]", "not process_logged_fatal_error[C]"]
        weight: moderate
      - when: ["last_exit_code[C, 137]", "not process_logged_fatal_error[C]",
               "memory_limit_plausibly_reached[C]"]
        weight: strong
    # The jvm trap, written as knowledge (008 §4.2): the reason counts against
    # OOM a little, so the answer says it disagrees, and the exit code decides.
    against:
      - when: "last_termination_reason[C, Reason], Reason != OOMKilled"
        weight: weak
    rules_out:
      - last_exit_code[C, Code], Code != 137
      - process_logged_fatal_error[C]
    refined_by: [memory-limit-too-low, memory-leak, workload-spike]
    # REMOVED: a note explaining that `reason` is unreliable and that exit 137
    # with reason "Error" is consistent with an OOM kill.
    #
    # It is true, and it is generic, so this file is the right home for it by
    # every argument in the header. It was still removed, because measurement
    # beat the argument: `traps` fell 6/6 -> 4/6 when it was added here, the same
    # direction and size as when the same knowledge sat in one cluster's
    # architecture notes as "exit 137 means check the memory limit". Telling the
    # agent the field is unreliable removes its reason to flag that this
    # instance disagrees -- which is the reasoning scenario 1 exists to measure --
    # and that happens wherever the sentence is written. The weak `against`
    # above does the opposite: it names the disagreement as owed a sentence.
    #
    # The general lesson, which cost two batches to learn: knowledge that
    # resolves a discrepancy in advance removes the discrepancy from the
    # investigation. A claim should say what evidence would decide a question,
    # not pre-decide it. It is also why the `for` above is on the exit code, as
    # the authored discriminator was.
    note: >-
      The process was killed from outside (SIGKILL), not failing on its own.
  application-crash:
    title: application crash
    for:
      - when: ["process_logged_fatal_error[C]", "last_exit_code[C, Code], Code != 137, Code != 143"]
        weight: strong
    rules_out:
      - ["last_exit_code[C, 137]", "not process_logged_fatal_error[C]"]
    note: >-
      Exit 137 with nothing logged before the cut means the process was killed
      from outside rather than failing on its own.
  bad-config:
    title: bad config
    # The vendored "ConfigMap, Secret or environment change" is two kinds: env
    # is in the pod template and rolls out; ConfigMap and Secret edits do not.
    for:
      - when: ["logs_name_invalid_setting[C]", "onset_observed[W]", "changed_before_onset[W, config]"]
        weight: strong
      - when: ["logs_name_invalid_setting[C]", "onset_observed[W]", "changed_before_onset[W, spec]"]
        weight: strong
      - when: ["exits_before_listener[C]", "onset_observed[W]", "changed_before_onset[W, config]"]
        weight: strong
      - when: ["exits_before_listener[C]", "onset_observed[W]", "changed_before_onset[W, spec]"]
        weight: strong
      # A setting the logs name is evidence before the change is seen: the
      # history a ConfigMap edit leaves is usually not there to see.
      - when: logs_name_invalid_setting[C]
        weight: moderate
    rules_out:
      - healthy_on_same_config[W]
    note: >-
      Where the configuration history cannot be seen, say so rather than
      treating an unchanged workload as ruling this out.
  failed-liveness-probe:
    title: failed liveness probe
    for:
      - when: ["liveness_probe_configured[C]", "probe_failures_before_restarts[C]", "last_exit_code[C, 143]"]
        weight: strong
      - when: ["liveness_probe_configured[C]", "probe_failures_before_restarts[C]"]
        weight: moderate
    rules_out:
      - not liveness_probe_configured[C]
      - restarts_before_initial_delay[C]
    note: >-
      Terminated with SIGTERM (143) rather than SIGKILL. No probe configured on
      the container at all rules this out outright, rather than merely
      weakening it.
  memory-limit-too-low:
    title: memory limit too low
    for:
      # Below the startup footprint, the limit is too low whatever came before:
      # nothing accumulates in a life that does not finish starting.
      - when: ["killed_in_every_retained_life[C]", "not completes_startup_in_retained_lives[C]"]
        weight: strong
      # Needs a history the capture often cannot show (007 §6.1).
      - when: ["killed_in_every_retained_life[C]", "not healthy_period_before_kills[C]"]
        weight: strong
      - when: ["limit_equals_request[C, memory]", "not runtime_sizing_flags_set[C]"]
        weight: moderate
    against:
      - when: healthy_period_before_kills[C]
        weight: moderate    # it once ran on this limit: look for what grew
    rules_out:
      - ["healthy_period_before_kills[C]", "onset_observed[W]",
         "not changed_before_onset[W, resources]", "not changed_before_onset[W, image]"]
    note: >-
      The limit is small relative to what the runtime needs by default -- a JVM,
      Go or Node process with no heap or arena sizing flags set sizes itself
      from the cgroup, so a limit equal to the request and no such flags is the
      shape to look for. A container killed on every life before it finishes
      starting has a limit below its startup footprint, whether or not it once
      ran on that limit: if it did, the footprint grew (a new image, a new
      agent), and that change is the trigger, not a rival. When it is refuted,
      something about the workload changed, not the provisioning.
  memory-leak:
    title: memory leak
    for:
      - when: ["lifetime_steady_or_shortening[C]", "completes_startup_in_retained_lives[C]",
               "memory_grows_within_life[C]"]
        weight: strong
      - when: ["lifetime_steady_or_shortening[C]", "completes_startup_in_retained_lives[C]"]
        weight: weak
    rules_out:
      - not completes_startup_in_retained_lives[C]
      - lifetime_varies_without_trend[C]
    note: >-
      Killed before it finishes starting means there was no period of operation
      in which anything could accumulate. Without a memory time series this can
      be weakened or refuted on timing alone but not confirmed, and an answer
      that states a peak usage figure has invented it.
  workload-spike:
    title: workload spike
    for:
      - when: ["load_rise_coincides_with_kills[C]", "completes_startup_in_retained_lives[C]"]
        weight: strong
      - when: peers_share_kill_timing[C]
        weight: weak
    rules_out:
      - not completes_startup_in_retained_lives[C]
      - kills_evenly_spaced_under_flat_load[C]
    note: >-
      A container that never reaches readiness served no traffic at all, so no
      request can have driven its memory up.

exclusive:
  - [memory-limit-too-low, memory-leak]

# What each vendored hypothesis became (007 §8.5). The build fails on a
# hypothesis of a mapped alert that is missing here, so none is lost in
# conversion by accident.
converts:
  CrashLoopBackOff:
    application crash: application-crash
    bad config: bad-config
    OOM: oom-kill
    failed liveness probe: failed-liveness-probe
  OOMKilled:
    memory limit too low: memory-limit-too-low
    memory leak: memory-leak
    workload spike: workload-spike
