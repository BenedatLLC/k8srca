# Public debugging guides the mined knowledge layer is extracted from (design 007 §8).
#
# `url` is the page a reader would cite; `fetch` is what the pipeline downloads,
# the raw source where one exists, so extraction reads markdown rather than a
# rendered page. `licence` was checked by hand (007 §8.2, 2026-10-16), and `use`
# follows from it:
#
#   vendor     extracted items, with verbatim quotes, may be committed under
#              docs/rca/mined/ with attribution
#   reference  may inform what we write; `k8srca kb mine` never extracts it
#
# A family is a batch: the symptoms it extends, what is in and out of scope,
# the vendored alerts it converts, and the sources read for it (the vendored
# records for those alerts are read too, without being listed). Families are mined and measured one at a time
# (007 §11).

