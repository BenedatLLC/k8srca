families:
  pod-restarting:
    title: Containers that restart or are killed
    symptoms: [pod-restarting, container-oom-killed]
    scope: >-
      A container that starts and then exits or is killed, repeatedly:
      CrashLoopBackOff, OOMKilled, rising restart counts, liveness or startup
      probe kills, and init containers that fail and are retried. Out of
      scope: pods that are never scheduled (Pending), images that cannot be
      pulled, and pods that are running but not ready without restarting.
    # The vendored alerts this family converts (007 §8.5). CrashLoopBackOff and
    # OOMKilled were converted by hand in stage 1; the rest are read from the
    # vendored records.
    alerts: [CrashLoopBackOff, OOMKilled, LivenessProbeFailed, StartupProbeFailed,
             PodRestartSpike, MemoryWorkingSetGrowing]
    sources:
      - k8s-debug-pods
      - k8s-pod-failure-reason
      - k8s-debug-init-containers
      - prom-kube-pod-crash-looping
      - aks-pod-restarts
      - aks-oomkilled
      - gke-crashloopbackoff
      - k8sgpt-pod-analyzer
      - robusta-restart-loop
      - robusta-oom-killer
      - robusta-pod-investigator
  request-latency:
    title: Requests that are slow
    symptoms: [request-latency]
    scope: >-
      A service whose requests are slow or time out while its pods keep
      running: its own CPU or memory pressure, CPU throttling, slow
      dependencies, DNS and network latency, and storage latency. Out of
      scope: pods that restart, are not scheduled or are not ready, and the
      Kubernetes control plane's own latency.
    alerts: [HighRequestLatency, ServiceLatencyHigh]
    sources:
      - prom-cpu-throttling-high
      - k8s-debug-service
      - k8s-dns-debugging
      - k8s-manage-resources
      - aks-high-cpu-containers
      - aks-memory-saturation
      - go-gc-guide
  pod-pending:
    title: Pods that are never scheduled or never start
    symptoms: [pod-pending]
    scope: >-
      A pod that stays Pending: the scheduler cannot place it (resources,
      node selectors, affinity, taints, a volume it waits on), or admission
      refuses it (a resource quota, a limit range, an admission webhook or
      policy), or its controller cannot create it. A pod waiting on a volume
      is a candidate here; why the volume does not bind is the storage
      family's. Out of scope: images that cannot be pulled, containers that
      start and then restart, and pods that run but are not ready.
    alerts: [PodPending, FailedScheduling, ResourceQuotaExceeded, LimitRangeViolation,
             AdmissionDenied, ReplicaSetFailure]
    sources:
      - k8s-debug-pods
      - k8s-manage-resources
      - k8s-assign-pod-node
      - k8s-taints
      - k8s-resource-quotas
      - k8s-limit-range
      - k8s-pod-priority
      - aks-pod-scheduler-errors
  image-and-sandbox:
    title: Pods not ready, and containers whose image or sandbox never comes up
    symptoms: [pod-not-ready, image-pull-failing]
    scope: >-
      A pod that is not ready, as the entry symptom: it is not scheduled, its
      container never starts because its image cannot be pulled or its sandbox
      cannot be created, or it runs but fails its readiness check. The image
      and sandbox causes are this family's: a tag or name that does not exist,
      registry authentication or reachability, pull rate limits, a platform
      mismatch, and sandbox or runtime failures on the node. Out of scope: why
      a pod is not scheduled (the pod-pending family, which a not-scheduled
      pod refines into), why a running pod fails readiness (service traffic),
      and containers that start and then restart.
    alerts: [ErrImagePull, ImagePullBackOff, FailedCreatePodSandbox, ContainerRuntimeDown]
    sources:
      - k8s-debug-pods
      - k8s-images
      - k8s-pull-private-registry
      - gke-image-pulls
      - aks-acr-pull
      - prom-kube-pod-not-ready
  storage:
    title: Claims that do not bind, and volumes that cannot be attached or mounted
    symptoms: [pvc-pending, volume-mount-failing]
    scope: >-
      Why a PersistentVolumeClaim does not bind: a StorageClass that does not
      exist, no class named and no default class, a provisioner or CSI driver
      that fails or is missing, no static volume that matches (capacity,
      access mode, selector), a topology or zone mismatch, and
      WaitForFirstConsumer read as a failure. And why a bound volume cannot be
      attached or mounted (including Multi-Attach), or is full. A pod waiting
      on an unbound claim is the pod-pending family's
      unbound-persistent-volume-claim, which refines into this family; a pod
      whose volume cannot be mounted is a cause of pod-not-ready
      (image-and-sandbox), which refines into this family. Out of scope: the
      scheduling causes of a Pending pod, storage quota (pod-pending's
      storage-quota-exhausted), and latency from slow storage
      (request-latency; StorageLatencyHigh is only an entry to it).
    alerts: [PVCPending, FailedAttachVolume, FailedMount, MultiAttachError, CSIControllerDown,
             VolumeFull, StorageLatencyHigh]
    sources:
      - k8s-persistent-volumes
      - k8s-storage-classes
      - k8s-dynamic-provisioning
      - k8s-default-storage-class
      - prom-kube-pv-errors
      - prom-kube-pv-filling-up
      - gke-storage
      - aks-azure-disk-mount
